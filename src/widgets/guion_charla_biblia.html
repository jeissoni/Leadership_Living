<script>
const secs = [
  {
    label: "Apertura",
    tiempo: "0 – 8 min",
    bloques: [
      { t: "nota", html: "Tono: cercano, sin prisa. No empezar con datos. Empezar con la pregunta que casi nadie dice en voz alta. Los pasajes se leen completos, de la Biblia física o proyectada, no de memoria." },
      { t: "blk", lbl: "La pregunta que nadie dice en voz alta", html: `<p class="script">Hay una pregunta que muchos de ustedes cargan hace tiempo, y que casi nadie se atreve a decir en voz alta en un grupo. La pregunta es esta: <strong>¿esto que tengo en las manos es Palabra de Dios, o es palabra de hombres religiosos que decidieron qué íbamos a creer?</strong><br><br>No es una pregunta rara. No es una pregunta de poca fe. Es la pregunta honesta de cualquiera que ha citado un versículo en un momento difícil y, en el fondo, se ha preguntado: ¿esto realmente tiene autoridad sobre mi vida, o es una frase bonita que uso porque así se hace aquí?<br><br>Y hay una segunda pregunta, más concreta, que aparece apenas el grupo deja de ser homogéneo: <strong>¿por qué tu Biblia tiene menos libros que la mía?</strong> Alguien creció en una familia católica, alguien más en una protestante, y de repente el número de libros no cuadra. Y ahí uno empieza a dudar de todo el paquete.</p>` },
      { t: "nota", html: "Pausa breve." },
      { t: "blk", lbl: "No son la misma pregunta", html: `<p class="script">Quiero decirles algo desde ya: <strong>no son la misma pregunta.</strong> Si las mezclamos, esta charla se convierte en un debate de índices y nadie se lleva nada a la casa. Así que las vamos a separar con cuidado.</p>` },
      { t: "dato", html: `<mark><strong>Confiable</strong> quiere decir: este texto no se inventó ayer, y lo que leemos hoy es sustancialmente lo que se escribió entonces. <strong>Eso se puede mostrar.</strong></mark><br><br><mark><strong>Inspirada</strong> quiere decir: Dios habla aquí, de verdad, no como metáfora. <strong>Eso no se demuestra como un teorema matemático. Se recibe.</strong></mark>` },
      { t: "blk", lbl: "Lo que sí puedo hacer esta noche", html: `<p class="script">Yo no vengo hoy a demostrarles que la Biblia es inspirada. Eso no está en mis manos, y honestamente, si alguien me lo pudiera demostrar con una fórmula, dejaría de ser fe. Lo que sí puedo hacer es quitarles obstáculos del camino. Mostrarles que este no es un libro cualquiera, que Jesús mismo lo trató como la voz de Dios, y dejarles el paso final — el de escuchar — a ustedes y al Espíritu.<br><br>Porque aquí está el verdadero problema que quiero que nos llevemos hoy, y se los adelanto para que lo tengan en la mente toda la charla: <strong>llevamos meses citando pasajes en nuestros turnos, en nuestras oraciones, en nuestras conversaciones. Y la pregunta no es «qué es la Biblia» en abstracto. La pregunta es cómo la estamos usando.</strong></p>` },
      { t: "pregunta", html: "¿Como voz que nos habla, o como herramienta que sacamos cuando nos toca el turno?" },
      { t: "blk", lbl: "El recorrido", html: `<p class="script">Vamos a recorrer tres paradas para responder esto: cómo llegó este texto hasta nosotros, por qué se puede confiar en él, y qué hay exactamente adentro — incluyendo por qué el número de libros cambia según la tradición. Y vamos a cerrar, no con una conclusión académica, sino con una pregunta que cada uno se lleva a su semana.</p>` },
      { t: "trans", html: "— Primera parada: cómo llegó hasta nosotros. —" }
    ]
  },
  {
    label: "Cómo llegó",
    tiempo: "8 – 20 min",
    bloques: [
      { t: "nota", html: "Tono: casi de historia contada, no de clase. Ir despacio en la imagen de los escribas." },
      { t: "blk", lbl: "No es un libro. Es una biblioteca.", html: `<p class="script">Antes de hablar de si se puede confiar, tenemos que aclarar algo que mucha gente no sabe: <strong>la Biblia no es un libro. Es una biblioteca.</strong><br><br>Sesenta y seis escritos. Cerca de cuarenta autores distintos. Casi mil quinientos años de diferencia entre el más antiguo y el más reciente. Tres idiomas: hebreo, arameo, griego. Tres continentes. Y los autores no son un gremio de teólogos sentados en una mesa. Son campesinos, reyes, profetas, un médico, un cobrador de impuestos, pescadores.</p>` },
      { t: "nota", html: "Pausa." },
      { t: "blk", lbl: "Nadie armó un comité", html: `<p class="script">Nadie armó un comité para inventar esto. Y aun así, el diagnóstico no cambia de principio a fin: Dios busca al hombre, el hombre huye, Cristo cumple. Eso ya lo vimos en <em>De la ley a Jesús</em>. Los acentos cambian — Jeremías no suena como Lucas — pero el centro no se rompe.<br><br>Ahora, ¿cómo se transmitió esto durante siglos sin computadores, sin imprenta, sin fotocopiadora?</p>` },
      { t: "blk", lbl: "Los escribas", html: `<p class="script">Con un cuidado que hoy nos parece obsesivo. El pueblo judío no copiaba la Escritura como quien copia una nota. La copiaba como quien copia un contrato legal. Los escribas — los <em>sofrim</em> — contaban las letras de cada rollo. Sabían cuál era la letra exacta que caía en la mitad de la Torá. Si un rollo tenía un solo error, no lo corregían con un tachón: <strong>lo apartaban.</strong> Después, los masoretas anotaron al margen del texto reglas precisas para que nadie, ni por accidente ni por buena intención, «mejorara» lo que estaba escrito.</p>` },
      { t: "ilustra", html: `<strong>El rumor y el documento notarial.</strong> Piensen en la diferencia. Un rumor se deforma — es el juego del teléfono roto, cada persona cambia un poco la frase. Pero un texto que se copia miles de veces, con reglas estrictas, y que además se puede <strong>comparar</strong> entre copias distintas, no se deforma igual: donde uno se equivocó, los otros mil no.` },
      { t: "blk", lbl: "El texto mejor atestiguado de la antigüedad", html: `<p class="script">Y esto no es solo del Antiguo Testamento. El Nuevo Testamento es, sin exagerar, <strong>el conjunto de textos antiguos mejor atestiguado que existe.</strong> Miles de manuscritos en griego. Traducciones tempranas al latín, al siríaco, al copto. Citas de los primeros líderes de la iglesia, tantas que casi se podría reconstruir el Nuevo Testamento solo con esas citas.<br><br>No tenemos el papiro original que salió de la mano de Juan. Eso es cierto, y no hay que esconderlo. Pero tenemos un texto que se puede <strong>rastrear</strong>. El fragmento más antiguo que solemos citar — un pedacito del evangelio de Juan conocido como P52 — se fecha hacia la primera mitad del siglo segundo. Es decir, décadas después de que se escribió el original, no siglos ni milenios. Compárenlo con otros textos clásicos de esa misma época, que muchas veces sobreviven en un puñado de copias hechas siglos más tarde, y van a entender por qué los historiadores tratan al Nuevo Testamento con un respeto documental distinto.</p>` },
      { t: "nota", html: "Tono más pausado, honesto." },
      { t: "blk", lbl: "Sí hay variantes", html: `<p class="script">¿Hay variantes entre manuscritos? Sí. Los copistas eran humanos, se equivocaban. Pero casi ninguna variante cambia una doctrina. Se los digo sin teatro y sin miedo: el texto es estable. No es mágico, es <strong>confiable</strong>.</p>` },
      { t: "blk", lbl: "Qumrán", html: `<p class="script">Y hay una prueba adicional que a mí personalmente me sorprendió cuando la conocí: los rollos del Mar Muerto, encontrados en Qumrán, contenían copias de Isaías que son <strong>siglos anteriores a Jesús</strong>. Y dicen, en lo sustancial, lo mismo que leemos hoy. Nadie reescribió al Mesías después de la Pascua para que cuadrara con Jesús. El texto ya decía lo que dice, antes de que Cristo naciera.<br><br>Y ahí el libro se atreve a algo todavía más fuerte: habla <strong>antes</strong> de que pase. Miqueas nombra a Belén como el lugar de nacimiento del gobernante prometido. Isaías nombra a Ciro, un rey persa, por su nombre, generaciones antes de que naciera. Y el siervo sufriente de Isaías 53 está escrito muchísimo antes de la cruz. Con tres ejemplos basta hoy — la lista completa de cumplimientos es la charla de <em>Jesús cumple todo</em>. Aquí solo quiero que vean algo: <strong>este texto no se escribió después de los hechos para que cuadrara.</strong></p>` },
      { t: "nota", html: "Leer completo, con calma." },
      { t: "verse", ref: "2 Timoteo 3:16–17", texto: "Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia, a fin de que el hombre de Dios sea perfecto, enteramente preparado para toda buena obra." },
      { t: "blk", lbl: "Para formar, no solo para informar", html: `<p class="script">Pablo le está hablando a Timoteo sobre las Escrituras que Timoteo ya tenía desde niño: el Antiguo Testamento. Y noten algo importante: el «soplo de Dios» que menciona Pablo no es un adorno piadoso que se pone al final de un argumento histórico, como quien firma un documento. Es la afirmación de que esas páginas <strong>sirven para formar a una persona</strong>, no solamente para informarla.</p>` },
      { t: "trans", html: "— Segunda parada: por qué confiar. —" }
    ]
  },
  {
    label: "Por qué confiar",
    tiempo: "20 – 32 min",
    bloques: [
      { t: "nota", html: "Tono: aquí se sube un poco la intensidad. Este es el corazón teológico de la charla." },
      { t: "blk", lbl: "La pregunta más honda", html: `<p class="script">Ahora quiero llevarlos un paso más adentro. Ya vimos que el texto es confiable, que no se inventó ayer y que llegó bien conservado. Pero la pregunta más honda sigue ahí: <strong>¿por qué es Palabra de Dios y no solo un texto antiguo bien conservado?</strong><br><br>La Biblia no se presenta a sí misma como un dictado mágico — como si Dios hubiera movido la mano de los escritores mientras ellos estaban en trance. Tampoco se presenta como «puramente humana», una colección de sabiduría religiosa. Dice las dos cosas <strong>a la vez</strong>.<br><br>Hombres reales escribieron estas páginas. Con su idioma, su época, sus lágrimas, su rabia, su estilo propio. Jeremías no suena como Lucas, ya lo dijimos. El Espíritu de Dios no apagó a la persona que escribía. <strong>La llevó.</strong></p>` },
      { t: "nota", html: "Leer completo." },
      { t: "verse", ref: "2 Pedro 1:21", texto: "…nunca la profecía fue traída por voluntad humana, sino que los santos hombres de Dios hablaron siendo inspirados por el Espíritu Santo." },
      { t: "blk", lbl: "Autoría doble", html: `<p class="script">La palabra griega que usa Pablo en 2 Timoteo 3:16 es <em>theopneustos</em>: literalmente, «soplada por Dios». Y esto es clave, así que quiero que se les quede grabado: <strong>inspiración no significa que Dios usó a las personas como si fueran un bolígrafo sin voluntad propia.</strong> Es lo que llamamos <strong>autoría doble</strong>: palabra plenamente humana, y a la vez, plenamente Palabra de Dios. Hecha por hombres. <strong>No inventada por hombres.</strong></p>` },
      { t: "nota", html: "Pausa. Bajar el tono: esto es lo más importante de la charla." },
      { t: "blk", lbl: "La razón más fuerte es Jesús", html: `<p class="script">Y aquí quiero ser directo con ustedes: la razón cristiana más fuerte para confiar en la Biblia <strong>no es la arqueología.</strong> No son los rollos del Mar Muerto, ni los manuscritos, ni los cumplimientos proféticos. Todo eso ayuda, todo eso quita obstáculos. Pero la razón más fuerte es <strong>Jesús</strong>.<br><br>Jesús cita el Antiguo Testamento constantemente con la fórmula «escrito está». Dice, sin rodeos, que la Escritura no puede ser quebrantada. Y después de resucitar — momento en que ya no tenía nada que demostrar, nada que ganar mintiendo — se sienta con sus discípulos y les abre, desde Moisés hasta los profetas, todo lo que las Escrituras decían de él.</p>` },
      { t: "nota", html: "Leer completo." },
      { t: "verse", ref: "Juan 10:35", texto: "…y la Escritura no puede ser quebrantada." },
      { t: "verse", ref: "Lucas 24:27", texto: "Y comenzando desde Moisés, y siguiendo por todos los profetas, les declaraba en todas las Escrituras lo que de él decían." },
      { t: "blk", lbl: "Su modo de leer pesa más que nuestra duda", html: `<p class="script">Si Cristo es quien decimos que es — si de verdad resucitó, si de verdad es Dios hecho hombre — entonces la manera en que <strong>él</strong> trata esas páginas pesa infinitamente más que nuestra duda inicial. Él no dudó de la autoridad de la Escritura. La citó como quien cita la última palabra.<br><br>Y el Nuevo Testamento es exactamente eso: el testimonio apostólico de ese mismo Cristo. Jesús mismo prometió que el Espíritu ayudaría a sus discípulos a recordar todo lo que él había enseñado. Y hay un detalle que a mí me parece hermoso: en 2 Pedro 3:16, Pedro ya llama «Escritura» a las cartas de Pablo. La iglesia no esperó cuatrocientos años y un concilio para reconocer la voz de Dios en el testimonio apostólico. La reconoció desde el principio.</p>` },
      { t: "dato", html: `Porque eso es lo que pasó con el canon, y quiero que quede muy claro: <strong>la iglesia no votó para convertir un libro cualquiera en divino.</strong> La iglesia <strong>reconoció</strong> lo que la comunidad ya venía leyendo como voz de Dios, usando tres criterios: origen apostólico o ligado directamente a los apóstoles, uso amplio y constante en las comunidades, y coherencia con el evangelio de Cristo.` },
      { t: "nota", html: "Leer completo." },
      { t: "verse", ref: "Hebreos 1:1–2", texto: "Dios, habiendo hablado muchas veces y de muchas maneras en otro tiempo a los padres por los profetas, en estos postreros días nos ha hablado por el Hijo." },
      { t: "blk", lbl: "La Escritura da testimonio de Cristo", html: `<p class="script">Dios habló durante siglos, de muchas formas. Y ahora habla, definitivamente, en el Hijo. La Escritura no compite con Cristo. <strong>Da testimonio de él.</strong> Es el mismo hilo que venimos siguiendo desde <em>Jesús cumple todo</em>.</p>` },
      { t: "nota", html: "Tono honesto, casi confidencial." },
      { t: "blk", lbl: "El paso que ningún dato cierra", html: `<p class="script">Y aquí tengo que decirles algo con total honestidad: hay un paso final que ningún dato cierra. Los manuscritos les quitan la excusa de «esto lo inventaron unos curas hace siglos». Jesús les quita la excusa de «esto es solo religión antigua como cualquier otra». Pero después de eso, <strong>el Espíritu es quien convence.</strong> Yo no puedo dárselos con un argumento. Solo puedo despejarles el camino.</p>` },
      { t: "trans", html: "— Tercera parada: qué hay dentro. —" }
    ]
  },
  {
    label: "Qué hay dentro",
    tiempo: "32 – 42 min",
    bloques: [
      { t: "nota", html: "Tono: más ligero, casi explicativo. Bajar la intensidad después del punto anterior." },
      { t: "blk", lbl: "La buena noticia primero", html: `<p class="script">Ahora sí, vamos a la segunda pregunta que planteamos al inicio: ¿por qué tu Biblia tiene más o menos libros que la mía?<br><br>Primero, la buena noticia, y quiero que se la lleven grabada: <strong>el Nuevo Testamento es el mismo. Veintisiete libros.</strong> Católicos, protestantes, ortodoxos: todos coinciden ahí, sin excepción. La diferencia está solamente en el <strong>Antiguo Testamento</strong>.</p>
        <table>
          <thead>
            <tr><th>Tradición</th><th>Antiguo Testamento</th><th>Total aproximado</th></tr>
          </thead>
          <tbody>
            <tr><td>Protestante</td><td>El canon hebreo — la Biblia de la sinagoga, la que Jesús recibió como Escritura</td><td>66</td></tr>
            <tr><td>Católica</td><td>Ese mismo canon más los libros deuterocanónicos</td><td>73</td></tr>
            <tr><td>Ortodoxa</td><td>Algunos libros adicionales; la lista varía entre iglesias</td><td>varía</td></tr>
          </tbody>
        </table>` },
      { t: "blk", lbl: "Un mapa pequeño para no perderse", html: `<p class="script">Antes de hablar de por qué cambian las listas, miremos rápidamente qué hay dentro. La Biblia no está organizada en orden cronológico, sino por tipos de libros —como los estantes de una biblioteca.</p>
        <table>
          <thead>
            <tr><th>Antiguo Testamento · 39 libros</th><th>Libros</th><th>Tema principal</th></tr>
          </thead>
          <tbody>
            <tr><td>Ley o Pentateuco (5)</td><td>Génesis–Deuteronomio</td><td>Creación, caída, pacto, éxodo y formación de Israel</td></tr>
            <tr><td>Históricos (12)</td><td>Josué–Ester</td><td>Tierra, jueces, reyes, exilio y regreso</td></tr>
            <tr><td>Poéticos y sapienciales (5)</td><td>Job–Cantares</td><td>Dolor, oración, adoración y sabiduría para vivir</td></tr>
            <tr><td>Profetas mayores (5)</td><td>Isaías–Daniel</td><td>Juicio, esperanza y promesa del Mesías</td></tr>
            <tr><td>Profetas menores (12)</td><td>Oseas–Malaquías</td><td>Fidelidad, justicia y llamado a volver a Dios</td></tr>
          </tbody>
        </table>
        <table>
          <thead>
            <tr><th>Nuevo Testamento · 27 libros</th><th>Libros</th><th>Tema principal</th></tr>
          </thead>
          <tbody>
            <tr><td>Evangelios (4)</td><td>Mateo–Juan</td><td>Vida, muerte y resurrección de Jesús</td></tr>
            <tr><td>Historia (1)</td><td>Hechos</td><td>Nacimiento y expansión de la iglesia</td></tr>
            <tr><td>Cartas de Pablo (13)</td><td>Romanos–Filemón</td><td>El evangelio aplicado a iglesias y creyentes</td></tr>
            <tr><td>Cartas generales (8)</td><td>Hebreos–Judas</td><td>Perseverancia, fe práctica y sana doctrina</td></tr>
            <tr><td>Profecía (1)</td><td>Apocalipsis</td><td>Cristo vence y Dios restaura todas las cosas</td></tr>
          </tbody>
        </table>
        <p class="script">Mayores y menores no significa más o menos importantes: describe su extensión. Y aunque los libros tengan géneros distintos, todos participan de una sola historia: <strong>creación, caída, redención y restauración; una historia que encuentra su centro en Jesús.</strong></p>` },
      { t: "blk", lbl: "Dos memorias, y las dos son reales", html: `<p class="script">Los libros «de más» que más se nombran son Tobías, Judit, primero y segundo de Macabeos, Sabiduría, Eclesiástico, Baruc, y algunos añadidos a Daniel y a Ester. Nacieron en el judaísmo del Segundo Templo, muchos escritos directamente en griego, y viajaron con la Septuaginta — la traducción griega del Antiguo Testamento que usó gran parte de la iglesia antigua. Pero los judíos de Palestina, en hebreo, nunca los tuvieron dentro de su Ley, sus Profetas y sus Escritos.<br><br>Por eso, honestamente, hay <strong>dos memorias, y las dos son reales</strong>:<br><br>Jesús y los apóstoles viven dentro del mundo de la Biblia hebrea. Cuando Jesús resucitado habla con sus discípulos, usa la división tradicional judía: Ley, Profetas, Salmos.<br><br>La iglesia de habla griega, en cambio, leía una Biblia más ancha, y citaba esos otros libros con respeto.</p>` },
      { t: "nota", html: "Leer completo." },
      { t: "verse", ref: "Lucas 24:44", texto: "Y les dijo: Estas son las palabras que os hablé, estando aún con vosotros: que era necesario que se cumpliese todo lo que está escrito de mí en la ley de Moisés, en los profetas y en los salmos." },
      { t: "dato", html: `<strong>Un dato rápido de historia</strong>, para que no quede la idea de que esto se inventó de la nada: Jerónimo, el que tradujo la Vulgata latina, ya distinguía entre los libros hebreos — para fundamentar doctrina — y los otros, útiles pero de otro nivel. Siglos después, la Reforma volvió al canon hebreo para el Antiguo Testamento, y el Concilio de Trento, en 1546, definió formalmente el canon de setenta y tres libros como respuesta a esa ruptura.` },
      { t: "blk", lbl: "La versión honesta", html: `<p class="script">Así que no es exacto decir «los católicos añadieron libros en el siglo dieciséis». Y tampoco es exacto decir «los protestantes recortaron la Biblia». La versión más honesta es esta: <strong>había dos listas en uso desde mucho antes, y cada tradición terminó cerrando una.</strong></p>` },
      { t: "nota", html: "Tono pastoral, dirigido a quien viene de familia mixta." },
      { t: "blk", lbl: "Para quien viene de familia católica", html: `<p class="script">Si alguno de ustedes viene de una familia católica y hoy está en un grupo protestante, quiero decirles algo directamente: <strong>nadie en su familia está leyendo otro evangelio por siete libros de diferencia.</strong> El centro — la Ley, los Profetas, los Evangelios, las cartas — es exactamente el mismo. Nosotros leemos sesenta y seis libros porque seguimos el canon que Jesús mismo recibió como Escritura. Esos otros libros se pueden leer con respeto, como historia y como devoción. Simplemente no los usamos para fundamentar doctrina.<br><br>Y aquí quiero que quede clarísimo: <strong>el índice no es la duda de fondo.</strong></p>` },
      { t: "pregunta", html: "La duda de fondo es la misma para las dos mesas: cuando se abre, ¿quién habla?" },
      { t: "trans", html: "— Y entonces, ¿cómo se lee? —" }
    ]
  },
  {
    label: "Cómo se lee",
    tiempo: "42 – 46 min",
    bloques: [
      { t: "nota", html: "Tono: breve, un puente hacia el cierre pastoral. No alargar." },
      { t: "blk", lbl: "Nunca un versículo suelto", html: `<p class="script">Un solo principio cabe aquí, y con eso basta: <strong>nunca un versículo suelto.</strong> Contexto, género literario, y sobre todo, dejar que la Escritura interprete a la Escritura — el Antiguo Testamento a la luz de Jesús, como ya recorrimos en charlas anteriores. El Espíritu ilumina el texto. No dicta un significado privado que lo contradiga.<br><br>2 Timoteo ya nos dijo para qué sirve la Escritura: enseñar, redargüir, corregir, instruir. Y Santiago añade el filo que este grupo necesita escuchar hoy:</p>` },
      { t: "nota", html: "Leer completo." },
      { t: "verse", ref: "Santiago 1:22", texto: "Pero sed hacedores de la palabra, y no tan solamente oidores, engañándoos a vosotros mismos." },
      { t: "blk", lbl: "Leer o coleccionar", html: `<p class="script">Ya lo dijimos en <em>El discípulo</em>: oír sin hacer deja la Palabra convertida en simple información. No lo voy a repetir como temario. Lo voy a apuntar directo hacia la Biblia misma: <strong>el que cita un versículo y no se deja cortar por él, no está leyendo. Está coleccionando.</strong></p>` },
      { t: "trans", html: "— Cierre. —" }
    ]
  },
  {
    label: "Cierre",
    tiempo: "46 – 55 min",
    bloques: [
      { t: "nota", html: "Tono: bajar el volumen, hablar más lento, mirar a la sala. Este es el momento que la gente se lleva." },
      { t: "blk", lbl: "¿Por qué Jesús hablaba en parábolas?", html: `<p class="script">Quiero cerrar volviendo a Jesús. Él tenía la verdad delante de la gente y, muchas veces, no la entregaba como una definición. Contaba una historia: un sembrador, una semilla, cuatro terrenos.<br><br>Los discípulos le preguntaron por qué hablaba así. La respuesta de Jesús es incómoda: dos personas pueden escuchar exactamente las mismas palabras y no oír lo mismo. Una oye una historia bonita. La otra reconoce que Dios la está llamando.<br><br>La parábola no era una adivinanza para premiar al más inteligente. Era un espejo del corazón. Al orgulloso le permitía quedarse afuera; al que se acercaba con hambre le abría el Reino. Por eso Jesús terminaba diciendo algo que parece obvio, pero no lo es.</p>` },
      { t: "verse", ref: "Marcos 4:9", texto: "El que tiene oídos para oír, oiga." },

      { t: "pregunta", html: "No solo: «¿entiendo lo que leo?». También: «¿estoy dispuesto a que Dios me diga algo que no quiero oír?»" },
      { t: "blk", lbl: "El Espíritu Santo abre el entendimiento", html: `<p class="script">Pero aquí hay una esperanza: no leemos solos.<br><br>El mismo Espíritu que inspiró la Escritura acompaña al creyente cuando la abre. Jesús prometió que el Espíritu enseñaría y recordaría sus palabras. Después de resucitar, abrió el entendimiento de sus discípulos para que comprendieran las Escrituras. Eso sigue siendo lo que necesitamos: no una voz nueva que compita con la Biblia, sino al Espíritu abriendo nuestros ojos para reconocer a Cristo en ella.<br><br>El Espíritu ilumina. Nos ayuda a comprender, trae la palabra a la memoria, muestra el pecado que habíamos justificado, consuela donde estamos heridos y nos da fuerza para obedecer. No inventa un significado privado que contradiga el texto. Hace que el texto entendido llegue al corazón y produzca fruto.</p>` },
      { t: "verse", ref: "Lucas 24:45", texto: "Entonces les abrió el entendimiento, para que comprendiesen las Escrituras." },
      { t: "verse", ref: "Juan 14:26", texto: "Mas el Consolador, el Espíritu Santo, a quien el Padre enviará en mi nombre, él os enseñará todas las cosas, y os recordará todo lo que yo os he dicho." },
      { t: "blk", lbl: "La postura antes de abrirla", html: `<p class="script">Por eso la lectura cristiana comienza antes del primer versículo. Comienza con una postura: «Señor, aquí estoy. No vengo solamente a confirmar lo que ya pienso. Estoy dispuesto a escuchar, a ser corregido y a obedecer».<br><br>El salmista no daba por hecho que, por tener ojos, ya podía ver. Oraba: «Abre mis ojos». Esa puede ser nuestra oración cada vez que abramos este libro.</p>` },
      { t: "verse", ref: "Salmo 119:18", texto: "Abre mis ojos, y miraré las maravillas de tu ley." },

      { t: "pastoral", lbl: "Cierre", html: `<p class="script">Hoy vimos cómo llegó la Biblia, por qué podemos confiar en ella y qué contiene. Pero nada de eso produce fruto por sí solo.<br><br>La semilla puede ser verdadera y el terreno permanecer cerrado. La Biblia puede estar abierta y el corazón seguir lejos.<br><br>Jesús todavía dice: «El que tiene oídos para oír, oiga». Y el Espíritu Santo todavía abre el entendimiento de quienes se acercan con hambre.<br><br>No necesitas saberlo todo para empezar. Necesitas acercarte dispuesto. La pregunta final no es solamente si la Biblia es confiable. La pregunta es si tú estás disponible para que Dios te hable por medio de ella.</p>` },

      { t: "nota", html: "Dejar silencio después de la pregunta. No explicar la parábola más de lo escrito. Evitar decir que la disposición humana «gana» revelación: la tierra recibe, pero es el Espíritu quien abre el entendimiento. Referencias añadidas: Marcos 4:1–20 · Mateo 13:10–17 · Lucas 24:45 · Juan 14:26 · Salmo 119:18." }

const nav = document.getElementById('nav');
const prog = document.getElementById('prog');
const panelsEl = document.getElementById('panels');

function render(i) {
  nav.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', j===i));
  prog.querySelectorAll('.ps').forEach((s,j) => {
    s.classList.toggle('done', j<i);
    s.classList.toggle('cur', j===i);
  });
  panelsEl.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', j===i));
}

secs.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nb'; btn.textContent = s.label;
  btn.onclick = () => render(i);
  nav.appendChild(btn);
  const ps = document.createElement('div'); ps.className = 'ps'; prog.appendChild(ps);
  const panel = document.createElement('div'); panel.className = 'panel';

  let html = `<div class="tbadge">⏱ ${s.tiempo}</div>`;

  s.bloques.forEach(b => {
    if (b.t === 'blk') {
      html += b.lbl
        ? `<div class="blk"><div class="blk-hd">${b.lbl}</div><div class="blk-bd">${b.html}</div></div>`
        : `<div class="blk"><div class="blk-bd">${b.html}</div></div>`;
    } else if (b.t === 'nota') {
      html += `<div class="nota">${b.html}</div>`;
    } else if (b.t === 'verse') {
      html += `<blockquote class="verse">${b.texto}<cite>${b.ref}</cite></blockquote>`;
    } else if (b.t === 'pregunta') {
      html += `<div class="pregunta">${b.html}</div>`;
    } else if (b.t === 'ilustra') {
      html += `<div class="ilustra">${b.html}</div>`;
    } else if (b.t === 'dato') {
      html += `<div class="dato">${b.html}</div>`;
    } else if (b.t === 'puente') {
      html += `<div class="puente">${b.html}</div>`;
    } else if (b.t === 'trans') {
      html += `<p class="trans">${b.html}</p>`;
    } else if (b.t === 'pastoral') {
      html += `<div class="pastoral"><div class="pastoral-lbl">${b.lbl}</div>${b.html}</div>`;
    }
  });

  html += `<div class="navbtns">
    <button class="navb" ${i===0?'disabled':''} onclick="render(${i-1})">← Anterior</button>
    <button class="navb" ${i===secs.length-1?'disabled':''} onclick="render(${i+1})">Siguiente →</button>
  </div>`;

  panel.innerHTML = html; panelsEl.appendChild(panel);
});

render(0);
</script>
