<script>
const secs = [
  {
    label: "Apertura",
    tiempo: "0 – 5 min",
    bloques: [
      { t: "blk", lbl: "El libro que ya usamos y casi no conocemos", html: `<p class="script">Llevamos meses abriendo este libro. Lo citamos en el turno. Lo mandamos por WhatsApp cuando alguien está mal. Y muy pocos podríamos contar de dónde salió, cómo llegó hasta esta mesa, o por qué le creemos.<br><br>Hoy no vengo a defenderlo como si estuviera en juicio. Vengo a mostrarles lo que tienen en la mano. Porque uno cuida distinto lo que sabe que es valioso.<br><br>Hay una pregunta debajo de todo esto, y muchos la cargan sin decirla.</p>` },
      { t: "pregunta", html: "Cuando abres la Biblia, ¿la oyes como voz, o la usas como herramienta?" },
      { t: "blk", lbl: "El recorrido de esta noche", html: `<p class="script">Cuatro paradas, y ninguna es una clase.<br><br>Primero: cómo se hizo y cómo llegó hasta aquí. Segundo: por qué podemos confiar en ella. Tercero: qué hay adentro, para que no te pierdas al abrirla. Y al final, lo único que de verdad me importa esta noche: qué hacemos con ella el martes.<br><br>No vinimos a ganar un debate. Vinimos a que este libro deje de ser un objeto de la mesa de noche.</p>` },
      { t: "nota", html: "Dejar respirar la pregunta inicial. No abrir con manuscritos ni con números. El objetivo es que cada uno note su propia relación con el libro antes de que lleguen los datos." }
    ]
  },
  {
    label: "Cómo llegó",
    tiempo: "5 – 21 min",
    bloques: [
      { t: "blk", lbl: "Cómo se hizo — una biblioteca, no un tomo", html: `<p class="script">Empecemos por el nombre. «Biblia» viene del griego <em>ta biblia</em>: <em>los libros</em>. En plural. El nombre mismo nos está diciendo que esto no es un libro.<br><br>Es una biblioteca. Sesenta y seis escritos. Cerca de cuarenta autores. Unos mil quinientos años. Tres idiomas: hebreo, arameo, griego. Tres continentes: Asia, África y Europa.<br><br>Y los autores no son un club de teólogos. Un pastor de ovejas. Un rey. Un copero. Un médico. Un cobrador de impuestos. Pescadores. Un perseguidor de cristianos que terminó escribiendo buena parte del Nuevo Testamento desde una cárcel.<br><br>Se escribió en rollos: piel curtida, papiro. No había capítulos ni versículos. Eso vino mucho después.</p>` },
      { t: "dato", html: `<strong>Los capítulos y los versículos no son inspirados.</strong> Los capítulos se los debemos a Esteban Langton, en el siglo XIII. Los versículos, al impresor Robert Estienne, en el XVI. Son un índice para poder buscar, como los números de una calle. Por eso arrancar un versículo suelto es sacar una frase de una conversación: útil para citar, peligroso para entender.` },
      { t: "blk", lbl: "Cómo se guardó — los guardianes del texto", html: `<p class="script">«Se copió a mano durante siglos, entonces se deformó.» Es lo que uno supondría. Y es al revés.<br><br>Hubo dos linajes de guardianes. Primero los <em>sofrim</em>, desde el regreso del exilio con Esdras. La palabra significa, literalmente, «los que cuentan». No es un apodo poético: contaban las letras del texto que copiaban. Siglos después vinieron los masoretas — «guardianes de la tradición» —, que perfeccionaron el sistema entre los años 500 y 1000.<br><br>Estos hombres sabían cuál era la letra que ocupaba el centro exacto de la Torah. Sabían cuál era el versículo del medio. Catalogaron cada palabra rara del texto, no para corregirla: para que nadie la «mejorara».</p>` },
      { t: "dato", html: `<strong>El oficio, en concreto.</strong> El escriba no podía escribir ni una letra de memoria: tenía el ejemplar abierto al frente y copiaba letra por letra. Pronunciaba cada palabra en voz alta antes de escribirla. Cada columna tenía un número fijo de líneas. Y si aparecía un solo error — una letra de más, una de menos —, el rollo entero quedaba descalificado. No se tachaba. Se apartaba.` },
      { t: "ilustra", html: `<strong>Dos mil horas por un rollo.</strong> Copiar a mano un rollo completo de la Torah tomaba alrededor de dos mil horas: un año de trabajo, de tiempo completo, de un hombre entrenado y certificado para eso. Y al terminar no lo leía para disfrutarlo: se sentaba a contar las letras, una por una, para verificar que no faltara ni sobrara ninguna respecto al ejemplar de referencia. Un año de vida, para que el texto llegara idéntico a la generación siguiente.` },
      { t: "blk", lbl: "El ejemplar contra el que se comparaba todo", html: `<p class="script">Y había un control más. Siempre existía una copia de referencia — durante siglos, guardada en el Templo — contra la cual se cotejaba cada rollo nuevo antes de ponerlo a circular. Si el conteo no coincidía, se revisaba letra por letra hasta hallar el error.<br><br>La tradición judía dice que Moisés, antes de morir, escribió trece rollos: uno para cada tribu y uno que se guardó dentro del Arca. Ese decimotercero era el testigo: si alguien alteraba una copia, el original la desmentía. Eso es tradición, no historia comprobada. Pero muestra la idea que gobernó mil quinientos años de copia: nunca se copia sin un testigo al lado.<br><br>Eso no es romanticismo. Es oficio. Y funcionó.</p>` },
      { t: "ilustra", html: `<strong>El teléfono descompuesto y la fotocopia.</strong> Un rumor se deforma porque cada uno oye una vez y pasa. Un texto copiado muchas veces, con reglas y con testigo, se puede comparar: donde uno se equivocó, los otros no. Las variantes no son el fin de la confianza. Son la razón por la que podemos decir qué decía el texto.` },
      { t: "nota", html: "Demostración opcional, dos minutos: pide a un voluntario que copie a mano un párrafo corto viendo el original solo unos segundos a la vez, sin memorizar, y cronométralo. Después: «eso, por miles de palabras, verificado letra por letra, durante generaciones»." },
      { t: "blk", lbl: "Cómo se reunió — reconocer, no inventar", html: `<p class="script">¿Quién decidió qué entraba? Esta es la parte donde se cuentan más películas.<br><br>La iglesia no se sentó a votar para volver divino un libro. Reconoció lo que ya se leía en voz alta cada domingo: escritos ligados a los apóstoles, usados por todas las comunidades, de acuerdo con el evangelio recibido. Cuando un concilio hace una lista, esa lista llega tarde: los manuscritos ya existían, las cartas ya circulaban, la iglesia ya sabía cuál era la voz de su Pastor.<br><br>Pedro, en vida, ya pone las cartas de Pablo junto a «las otras Escrituras». Eso no lo decidió ningún emperador.</p>` },
      { t: "blk", lbl: "Cómo llegó a tu idioma", html: `<p class="script">Del hebreo y el griego, al latín con Jerónimo. Del latín, encerrado en monasterios y copiado a mano, a una imprenta que en 1455 imprime justamente una Biblia.<br><br>Y después, gente que pagó caro que tú la puedas leer hoy. Tyndale la tradujo al inglés desde el griego y murió por eso. Casiodoro de Reina la tradujo al español en 1569 — la llaman la Biblia del Oso, por el grabado de la portada — y la terminó en el exilio, huyendo. Cipriano de Valera la revisó en 1602. Esa es la Reina-Valera que muchos tienen en la mano sin saber lo que costó.<br><br>Que tú la abras en el bus, en tu idioma, por unos pocos pesos, es el final de una carrera de relevos de siglos. Hubo gente que la copió a mano toda su vida. Hubo gente que se quemó por ella.</p>` },
      { t: "dato", html: `<strong>Una frase sobre 66 y 73, y seguimos.</strong> El Nuevo Testamento es el mismo para católicos, protestantes y ortodoxos: veintisiete libros. La diferencia está en el Antiguo: la lista hebrea (la de la sinagoga, la que Jesús nombra en Lucas 24:44) y la lista griega, más ancha. Dos listas antiguas, no dos evangelios. Si alguien pregunta, hay detalle en el complemento. Esta noche no es el tema.` },
      { t: "nota", html: "Dieciséis minutos, la parada más larga de la noche. Es narración, no cátedra. Si te enredas en fechas, quédate con cuatro imágenes: el escriba contando letras, las dos mil horas, la imprenta, Casiodoro huyendo. Nadie recuerda un año; todos recuerdan que alguien pagó por su Biblia. Si vas corto de tiempo, el bloque del rollo testigo es lo primero que se corta." },
      { t: "trans", html: "— Así llegó. Ahora: ¿por qué confiar en ella? —" }
    ]
  },
  {
    label: "Por qué confiar",
    tiempo: "21 – 34 min",
    bloques: [
      { t: "blk", lbl: "Cuatro razones, ninguna es un teorema", html: `<p class="script">Aviso primero, para no venderles humo: yo no puedo demostrar que Dios habla aquí como se demuestra un teorema. Si les prometo eso, les miento.<br><br>Lo que sí puedo hacer es quitar la excusa de «esto lo inventaron». Cuatro razones. Las tres primeras se muestran. La cuarta es la que más pesa para un cristiano.</p>` },
      { t: "blk", lbl: "1. Coherencia — nadie armó un comité", html: `<p class="script">Cuarenta autores, mil quinientos años, tres idiomas, gente que jamás se sentó en la misma mesa. Deberían contradecirse en lo esencial. Y no.<br><br>El diagnóstico no cambia: el hombre huye, Dios busca, la herida no se arregla con hojas de higuera. Génesis 3. El sistema que cubría. El velo rasgado. Ya lo recorrieron en la serie anterior. Hoy solo lo nombro: ese hilo no se fabrica por coincidencia. Si esto fuera la opinión religiosa de cada siglo, el Dios del éxodo no se parecería al de las cartas de Pablo. Se parece. Distintos acentos. La misma historia.</p>` },
      { t: "dato", html: `<strong>Coherencia no es que todos suenen igual.</strong> Jeremías no escribe como Lucas. Un salmo no es una genealogía. Hay géneros y hay tensiones de estilo. Lo que no se rompe es el centro: un Dios santo que no ignora el mal y no abandona al que falló.` },
      { t: "blk", lbl: "2. El texto que tenemos es el que se escribió", html: `<p class="script">Ya vimos el trabajo del escriba. Este es el resultado, y aquí sí hay con qué medir.<br><br>En 1947 aparecieron los rollos del Mar Muerto. Entre ellos, un Isaías completo copiado alrededor del año 125 antes de Cristo. Eso permitió hacer algo que nunca se había podido hacer: poner lado a lado el texto que usamos y una copia mil años más antigua. El resultado fue que coinciden casi por completo, y las diferencias son de ortografía, no de contenido. Mil años de copia a mano, y el texto seguía siendo el mismo.<br><br>Con el Nuevo Testamento pasa algo parecido por otro camino: es el texto antiguo mejor atestiguado que existe. Más de cinco mil ochocientas copias en griego, más las traducciones tempranas, más los Padres que lo citan.</p>` },
      { t: "dato", html: `<strong>Para dimensionarlo.</strong> De las <em>Historias</em> de Tácito sobreviven unos veinte manuscritos, y el más antiguo es unos ochocientos años posterior al autor. De Virgilio, un puñado. Nadie duda de que Tácito existió ni de lo que escribió; los historiadores trabajan con eso todos los días. El Nuevo Testamento tiene miles de copias y las más tempranas están a décadas del original, no a siglos. Si el criterio sirve para la historia antigua, aquí sobra.` },
      { t: "blk", lbl: "Lo que sí puedo prometer", html: `<p class="script">Kurt Aland pasó cuarenta años de su vida comparando manuscritos del Nuevo Testamento — no era un predicador, era un especialista en texto — y su conclusión fue que se transmitió mejor que cualquier otro escrito de la antigüedad.<br><br>Eso no demuestra que Dios habla aquí. Demuestra otra cosa, y no es poca: que no estamos leyendo un rumor. Hay variantes, claro. Casi ninguna cambia una doctrina, y ninguna cambia el evangelio. Texto estable, no texto mágico.</p>` },
      { t: "blk", lbl: "3. Profecía — dicha antes, no inventada después", html: `<p class="script">El libro se atreve a hablar <em>antes</em>. Tres ejemplos, no trece.<br><br>Miqueas nombra Belén, un pueblo que no era capital, siglos antes del pesebre. Isaías nombra a Ciro, un rey persa, antes de que Ciro mandara. Y el siervo que carga iniquidad está escrito en Isaías 53 mucho antes de la cruz — y ese rollo estaba en Qumrán, guardado, antes de que Jesús naciera.<br><br>No es que alguien fabricara el Antiguo después de Pascua para que Jesús encajara. El texto ya estaba.</p>` },
      { t: "verse", ref: "Miqueas 5:2", texto: "Pero tú, Belén Efrata, pequeña para estar entre las familias de Judá, de ti me saldrá el que será Señor en Israel." },
      { t: "blk", lbl: "4. La razón que más pesa: Jesús", html: `<p class="script">Y llegamos a la de verdad. Para un cristiano, el argumento más fuerte no es la arqueología. Es cómo Jesús trata este libro.<br><br>En el desierto, con hambre y acorralado, no improvisa una espiritualidad: dice «escrito está». Discutiendo, afirma que la Escritura no puede ser quebrantada. Y resucitado, lo primero que hace con dos discípulos derrotados es abrirles a Moisés, los Profetas y los Salmos para mostrarles que hablaban de él.<br><br>Si Cristo es quien decimos que es, su manera de oír estas páginas pesa más que nuestro recelo.</p>` },
      { t: "verse", ref: "Juan 10:35", texto: "…y la Escritura no puede ser quebrantada." },
      { t: "verse", ref: "Lucas 24:27", texto: "Y comenzando desde Moisés, y siguiendo por todos los profetas, les declaraba en todas las Escrituras lo que de él decían." },
      { t: "blk", lbl: "Hecha por hombres, no inventada por hombres", html: `<p class="script">Entonces, ¿es palabra de hombres o Palabra de Dios? Las dos. Y no es trampa: el libro mismo lo dice así.<br><br>Hombres reales escribieron: su idioma, su época, sus lágrimas, su rabia. El Espíritu no apagó a la persona. La llevó. Pablo le dice a Timoteo que toda la Escritura es soplada por Dios, y para qué sirve: no para ganar discusiones, sino para formar a alguien.</p>` },
      { t: "verse", ref: "2 Pedro 1:21", texto: "…nunca la profecía fue traída por voluntad humana, sino que los santos hombres de Dios hablaron siendo inspirados por el Espíritu Santo." },
      { t: "verse", ref: "2 Timoteo 3:16–17", texto: "Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia, a fin de que el hombre de Dios sea perfecto, enteramente preparado para toda buena obra." },
      { t: "nota", html: "No entrar a inerrancia vs infalibilidad. Si sale, una frase: lo que Dios quiso decir, lo dijo; las traducciones no son el original. No enumerar 5.800 manuscritos como trofeo, y no recorrer la lista mesiánica de Jesús cumple todo." },
      { t: "trans", html: "— Entonces vale la pena abrirla. ¿Y qué hay adentro? —" }
    ]
  },
  {
    label: "Qué hay adentro",
    tiempo: "34 – 45 min",
    bloques: [
      { t: "blk", lbl: "Un mapa para no perderse", html: `<p class="script">Mucha gente abre la Biblia por la mitad, cae en Levítico o en Números, y la cierra pensando que el problema es suyo. No lo es. Es que nadie le dio el mapa.<br><br>La Biblia no está en orden cronológico. Está agrupada por tipo de escrito, como estantes de una biblioteca. Y el género importa: un salmo no se lee como una ley, y una parábola no se lee como una carta. Si sabes en qué estante estás parado, la lectura cambia.</p>` },
      { t: "dato", html: `<strong>Antiguo Testamento — 39 libros, cinco estantes.</strong><br><br><strong>Ley (5):</strong> Génesis a Deuteronomio. El origen, la caída, un pueblo formado, la salida de Egipto, la Ley. Aquí empieza todo lo que vieron en la serie anterior.<br><br><strong>Históricos (12):</strong> Josué a Ester. La tierra, los jueces, los reyes, el destierro y el regreso. La historia de un pueblo que sube y cae, y de un Dios que no se va.<br><br><strong>Poéticos y sabiduría (5):</strong> Job a Cantares. Aquí está el dolor con nombre, la oración cruda, el que pregunta «¿hasta cuándo?». Salmos es el libro más honesto de la Biblia.<br><br><strong>Profetas mayores (5):</strong> Isaías a Daniel. Mayores por extensión, no por importancia. Llamado, juicio, y una esperanza que apunta hacia adelante.<br><br><strong>Profetas menores (12):</strong> Oseas a Malaquías. Doce libros cortos. Y después de Malaquías, cuatrocientos años de silencio antes del pesebre.` },
      { t: "dato", html: `<strong>Nuevo Testamento — 27 libros, cinco estantes.</strong><br><br><strong>Evangelios (4):</strong> Mateo, Marcos, Lucas y Juan. Cuatro retratos del mismo Jesús, cada uno para un lector distinto. No son cuatro versiones que compiten: son cuatro testigos.<br><br><strong>Hechos (1):</strong> qué pasó cuando vino el Espíritu. La iglesia naciendo, cometiendo errores, extendiéndose.<br><br><strong>Cartas de Pablo (13):</strong> Romanos a Filemón. Correo real a iglesias reales con problemas reales. La mayoría de lo que sabemos de la identidad en Cristo salió de aquí.<br><br><strong>Cartas generales (8):</strong> Hebreos a Judas. Escritas a creyentes dispersos, muchos bajo presión. Santiago es el más incómodo: fe que se ve.<br><br><strong>Apocalipsis (1):</strong> el final no está en duda. Es un libro de esperanza para una iglesia perseguida, no un rompecabezas para adivinar fechas.` },
      { t: "blk", lbl: "El hilo que atraviesa los diez estantes", html: `<p class="script">Diez estantes, sesenta y seis libros, y una sola historia con cuatro movimientos. Dios crea un mundo bueno. El hombre lo rompe. Dios trabaja durante siglos para rescatar lo que se rompió, y eso culmina en Jesús. Y al final, una creación nueva donde Dios habita con los suyos.<br><br>Eso no es una colección de historias morales sueltas. Tampoco un manual de reglas. Es una historia con dirección, y cada estante aporta un tramo.<br><br>Por eso el Antiguo se lee a la luz de Jesús. No es un apéndice que ya pasó de moda. Es la primera mitad de la misma historia.</p>` },
      { t: "ilustra", html: `<strong>La sinfonía.</strong> Imaginen una sinfonía escrita a lo largo de mil quinientos años, donde cada compositor solo alcanzó a oír los movimientos anteriores y nunca los que vendrían después. Y cuando por fin se toca completa, suena como si un solo compositor la hubiera escrito de principio a fin. Eso es esta biblioteca.` },
      { t: "puente", html: `<strong>Por dónde empezar, si alguien nunca ha leído.</strong> No por Génesis con la meta de llegar a Apocalipsis en un año: casi todos mueren en Levítico. Empieza por un Evangelio — Marcos o Juan —, sigue con Hechos, y de ahí a una carta corta como Filipenses. Los Salmos, en paralelo, para orar. El mapa completo puede esperar.` },
      { t: "nota", html: "Once minutos. No leer los sesenta y seis nombres en voz alta. Si el grupo se apaga, corta los estantes del AT a tres frases y salta al hilo y a la sinfonía. Lo importante no es la lista: es que salgan sabiendo dónde pararse cuando abran." },
      { t: "nota", html: "Apoyo visual opcional: lleva sesenta y seis fichas o papeles con los nombres, agrupados por estante, y ármalos sobre la mesa mientras hablas. Ver el montón hace lo que la explicación no hace. También sirve una línea de tiempo simple: Abraham → éxodo → David → destierro → Jesús → apóstoles." },
      { t: "trans", html: "— Entonces se abre. No para ganar. Para ser cortado. —" }
    ]
  },
  {
    label: "Cierre",
    tiempo: "45 – 55 min",
    bloques: [
      { t: "blk", lbl: "No un versículo suelto", html: `<p class="script">Un solo principio de lectura, y basta para esta noche. No un versículo arrancado para ganar un turno. Contexto. El Antiguo a la luz de Jesús, que ya vieron. El Espíritu ilumina; no te dicta un significado privado que contradiga la página.<br><br>Pablo dijo para qué sirve: formar a alguien. No para que salgas con más datos. Para que salgas distinto.</p>` },
      { t: "verse", ref: "Hebreos 4:12", texto: "Porque la palabra de Dios es viva y eficaz, y más cortante que toda espada de dos filos; y penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón." },
      { t: "blk", lbl: "Tres personas en esta sala", html: `<p class="script">A quien nunca se atrevió a preguntar en voz alta si esto es de Dios: no eres menos creyente por haberlo pensado. Hoy no te pedí que tragaras un teorema. Te mostré un texto serio, un Jesús que lo trata como Escritura, y un Espíritu que convence. El paso que falta no es más prueba. Es oír.<br><br>A quien la abre para tener frase en el turno, para no quedar mal, para que Dios no te olvide: eso se parece al palacio de afuera. El problema no es que leas poco. Es que la usas. Si es Palabra de Dios, el turno no es el examen. La página te examina a ti. El versículo que no te corta, y se lo lanzas al de al lado, no lo leíste. Lo armaste.<br><br>A quien creció con más libros en la mesa de la abuela: no te traje aquí a ganarles. Nadie en tu casa está leyendo otro Cristo por siete libros. El índice no te salva ni te condena. La pregunta es la misma para las dos mesas: cuando se abre, ¿quién habla?</p>` },
      { t: "verse", ref: "Santiago 1:22", texto: "Pero sed hacedores de la palabra, y no tan solamente oidores, engañándoos a vosotros mismos." },
      { t: "blk", lbl: "Por qué sigue en pie", html: `<p class="script">Y una cosa más, que no es un dato.<br><br>Este libro sobrevivió a imperios que lo quisieron quemar, a siglos en que copiarlo costaba un año de vida, a traductores ejecutados, a persecuciones y a cambios de idioma. Sigue aquí. Y no porque el papel aguante — el papel no aguanta. Está aquí porque el que lo dijo se encargó de que llegara.<br><br>Isaías lo escribió cuando su pueblo se caía a pedazos: la hierba se seca, la flor se marchita, pero la palabra de nuestro Dios permanece para siempre. Pedro se lo repite siglos después a unos cristianos perseguidos. Y Jesús lo dice sin adornos: el cielo y la tierra pasarán, pero mis palabras no pasarán.<br><br>Que hoy la tengas en la mano no es un accidente de la historia.</p>` },
      { t: "verse", ref: "Isaías 40:8", texto: "Sécase la hierba, marchítase la flor; mas la palabra del Dios nuestro permanece para siempre." },
      { t: "verse", ref: "Mateo 24:35", texto: "El cielo y la tierra pasarán, pero mis palabras no pasarán." },
      { t: "puente", html: `<strong>Esta semana, una sola cosa.</strong> No un plan de lectura de 66 libros. Un pasaje. Lento. Antes del turno, o después. No para citarlo. Para preguntar: ¿qué está cortando en mí? Si no corta nada, todavía la estás usando de herramienta.` },
      { t: "pastoral", lbl: "Cierre — no resumir los datos", html: `<p class="script">Puedo contarles cómo se hizo y cómo llegó: escribas contando letras, hombres traduciendo a escondidas, alguien muriendo para que tú la leyeras en tu idioma. Puedo mostrarles que es un texto serio: un hilo, unas copias, palabras dichas antes. Puedo mostrarles que Jesús la trata como Escritura que no se quiebra. Puedo darles el mapa de los sesenta y seis.<br><br>No puedo oírla por ustedes.<br><br>Y ahí está lo que me duele: tanta gente pagó tanto para que este libro llegara a tu mesa, y hoy vive ahí, cerrado, al lado del cargador del celular.<br><br>Esta semana no les pido que ganen una discusión. Les pido que la abran. Y que dejen que los corte. Porque si es voz, no se colecciona. Se obedece. Y si todavía no estás seguro de que sea voz, ábrela igual: el Espíritu no necesita que hayas ganado el debate para hablar.</p>` },
      { t: "pregunta", html: "Esta semana, ¿la abres como voz o como herramienta?" },
      { t: "pastoral", lbl: "Oración de cierre — modelo, no libreto", html: `<p class="script">Padre:<br><br>Gracias por este libro que resistió el paso de los siglos. Gracias por cada hombre que pasó su vida copiándolo letra por letra, y por los que pagaron con la vida para que hoy lo leamos en nuestro idioma.<br><br>Perdónanos por tenerlo cerca y no oírlo. Por abrirlo para tener algo que decir, y no para que nos digas algo.<br><br>Que esta semana lo abramos distinto. No con curiosidad, sino con hambre. Y que lo que leamos nos corte donde haga falta.<br><br>Amén.</p>` },
      { t: "nota", html: "No acortar el silencio. No añadir un dato más después de Mateo 24:35. Tres personas: nombrarlas sin señalar a nadie. La oración es modelo: si te sale otra en el momento, mejor." }
    ]
  }
];

const nav = document.getElementById('nav');
const prog = document.getElementById('prog');
const panelsEl = document.getElementById('panels');

function render(i) {
  nav.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', j===i));
  prog.querySelectorAll('.ps').forEach((s,j) => {
    s.classList.toggle('done', j<i);
    s.classList.toggle('cur', j===i);
  });
  panelsEl.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', j===i));
}

secs.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nb'; btn.textContent = s.label;
  btn.onclick = () => render(i);
  nav.appendChild(btn);
  const ps = document.createElement('div'); ps.className = 'ps'; prog.appendChild(ps);
  const panel = document.createElement('div'); panel.className = 'panel';

  let html = `<div class="tbadge">⏱ ${s.tiempo}</div>`;

  s.bloques.forEach(b => {
    if (b.t === 'blk') {
      html += `<div class="blk"><div class="blk-hd">${b.lbl||'Guión'}</div><div class="blk-bd">${b.html}</div></div>`;
    } else if (b.t === 'nota') {
      html += `<div class="nota">${b.html}</div>`;
    } else if (b.t === 'verse') {
      html += `<blockquote class="verse">${b.texto}<cite>${b.ref}</cite></blockquote>`;
    } else if (b.t === 'pregunta') {
      html += `<div class="pregunta">${b.html}</div>`;
    } else if (b.t === 'ilustra') {
      html += `<div class="ilustra">${b.html}</div>`;
    } else if (b.t === 'dato') {
      html += `<div class="dato">${b.html}</div>`;
    } else if (b.t === 'puente') {
      html += `<div class="puente">${b.html}</div>`;
    } else if (b.t === 'trans') {
      html += `<p class="trans">${b.html}</p>`;
    } else if (b.t === 'pastoral') {
      html += `<div class="pastoral"><div class="pastoral-lbl">${b.lbl}</div>${b.html}</div>`;
    }
  });

  html += `<div class="navbtns">
    <button class="navb" ${i===0?'disabled':''} onclick="render(${i-1})">← Anterior</button>
    <button class="navb" ${i===secs.length-1?'disabled':''} onclick="render(${i+1})">Siguiente →</button>
  </div>`;

  panel.innerHTML = html; panelsEl.appendChild(panel);
});

render(0);
</script>
