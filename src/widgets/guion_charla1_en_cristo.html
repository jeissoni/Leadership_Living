
<style>

.nav { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 16px; }
.nb { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.nb:hover { background: var(--color-background-secondary); }
.nb.on { background: #26215C; border-color: #534AB7; color: #CECBF6; }
@media (prefers-color-scheme: light) { .nb.on { background: #EEEDFE; border-color: #AFA9EC; color: #3C3489; } }

.panel { display: none; }
.panel.on { display: block; }

.prog { display: flex; gap: 3px; margin-bottom: 16px; }
.ps { height: 3px; border-radius: 2px; flex: 1; background: var(--color-border-tertiary); transition: background 0.3s; }
.ps.done { background: #534AB7; }
.ps.cur { background: #AFA9EC; }

.tbadge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: #854F0B; background: #FAEEDA; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; }
@media (prefers-color-scheme: dark) { .tbadge { background: #412402; color: #FAC775; } }

.blk { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; margin-bottom: 10px; }
.blk-hd { font-size: 10px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; padding: 6px 14px; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-secondary); }
.blk-bd { padding: 14px 16px; }

.script { font-size: 14px; line-height: 1.8; color: var(--color-text-primary); }
.script em { color: var(--color-text-secondary); font-style: italic; }
.script strong { font-weight: 500; }

.nota { font-size: 12px; line-height: 1.6; color: var(--color-text-secondary); border-left: 2px solid var(--color-border-secondary); padding: 8px 12px; margin: 10px 0; border-radius: 0; }

.verse { font-family: var(--font-serif); font-size: 14px; line-height: 1.8; color: var(--color-text-primary); padding: 12px 16px; background: #EEEDFE; border-radius: var(--border-radius-md); margin: 10px 0; }
@media (prefers-color-scheme: dark) { .verse { background: #26215C; } }
.verse cite { display: block; font-family: var(--font-sans); font-size: 11px; font-weight: 500; color: #534AB7; margin-top: 5px; font-style: normal; }
@media (prefers-color-scheme: dark) { .verse cite { color: #AFA9EC; } }

.pregunta { font-size: 14px; font-weight: 500; color: var(--color-text-primary); border-left: 3px solid #7F77DD; padding: 10px 14px; margin: 10px 0; border-radius: 0; background: var(--color-background-secondary); }

.ilustra { font-size: 13px; line-height: 1.65; color: #085041; background: #E1F5EE; border-radius: var(--border-radius-md); padding: 12px 14px; margin: 10px 0; }
@media (prefers-color-scheme: dark) { .ilustra { background: #04342C; color: #9FE1CB; } }
.ilustra strong { color: #0F6E56; font-weight: 500; }
@media (prefers-color-scheme: dark) { .ilustra strong { color: #5DCAA5; } }

.dato { font-size: 13px; line-height: 1.65; color: #185FA5; background: #E6F1FB; border-radius: var(--border-radius-md); padding: 12px 14px; margin: 10px 0; }
@media (prefers-color-scheme: dark) { .dato { background: #042C53; color: #85B7EB; } }
.dato strong { color: #185FA5; font-weight: 500; }
@media (prefers-color-scheme: dark) { .dato strong { color: #85B7EB; } }

.puente { font-size: 13px; line-height: 1.65; color: #854F0B; background: #FAEEDA; border-radius: var(--border-radius-md); padding: 12px 14px; margin: 10px 0; }
@media (prefers-color-scheme: dark) { .puente { background: #412402; color: #FAC775; } }
.puente strong { font-weight: 500; }

.trans { font-size: 13px; font-style: italic; color: var(--color-text-tertiary); text-align: center; padding: 8px 0 4px; }

.navbtns { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 14px; border-top: 0.5px solid var(--color-border-tertiary); }
.navb { font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
.navb:disabled { opacity: 0.3; cursor: default; }
.navb:not(:disabled):hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
</style>

<h2 class="sr-only">Guión completo — Charla 1: En Cristo. Seis secciones navegables con tiempos, textos, ilustraciones y notas de presentación.</h2>

<div class="nav" id="nav"></div>
<div class="prog" id="prog"></div>
<div id="panels"></div>

<script>
const secs = [
  {
    label: "Intro",
    tiempo: "0 – 7 min",
    bloques: [
      { t: "contexto", lbl: "Antes de empezar · ubica la serie", html: `<p class="script">Llevamos varias charlas recorriendo la historia de Dios con la humanidad. Hablamos del Reino, de la caída, de la ley, de los sacrificios, del templo. Y llegamos hasta Jesús, que cumplió con todo eso.<br><br>Pero ahora hay una pregunta que queda en el aire: ¿y yo qué? ¿Qué cambió para mí cuando Jesús hizo lo que hizo?<br><br>Las próximas tres charlas van a responder eso. Y hoy vamos con el fundamento. Con lo que hace posible todo lo demás.</p>` },
      { t: "guion", lbl: "Gancho de apertura", html: `<p class="script">Quiero empezar con un experimento.<br><br>Cierra los ojos un segundo. <em>[Pausa 5 segundos.]</em> Piensa en la última vez que alguien te dijo algo sobre quién eres tú. Puede haber sido algo bueno: "eres muy buena persona", "eres el tipo de líder que necesitamos." O algo difícil: "no sirves para esto", "siempre haces lo mismo."<br><br>¿Cuánto tiempo duró ese comentario en tu cabeza?<br><br>La psicología tiene una respuesta bastante incómoda a esa pregunta. Y esta noche vamos a conectar esa respuesta con algo que Pablo escribió hace 2000 años.</p>` },
      { t: "dato", lbl: "Dato de apertura · úsalo si el grupo responde bien", html: `<p class="dato">La investigación psicológica de las últimas décadas es clara: <strong>la identidad no es el resultado del comportamiento. Es su causa.</strong> Lo que crees que eres determina cómo actúas — no al revés. Una persona que se cree atleta va al gimnasio cuando llueve. Una persona que "está intentando hacer ejercicio" siempre encuentra una razón para no ir. La diferencia no es la disciplina. Es la identidad.<br><br>Si eso es cierto en cualquier área de la vida, imagina lo que significa tener una identidad que es inamovible. Que no depende de lo que hagas, de lo que sientas, de lo que los demás digan.<br><br>Eso es de lo que vamos a hablar hoy.</p>` },
      { t: "nota", html: "Tono: curioso, no predicador. Hablar como quien va a mostrar algo que descubrió, no como quien va a enseñar una lección. Esto disminuye la resistencia en adultos que ya han escuchado muchas charlas de iglesia." }
    ]
  },
  {
    label: "El problema",
    tiempo: "7 – 15 min",
    bloques: [
      { t: "guion", lbl: "Diagnóstico honesto", html: `<p class="script">Antes de entrar al texto, necesito que pensemos en algo que pasa mucho adentro de la iglesia. Y quizás pasa en nosotros.<br><br>Hay una manera de seguir a Dios que se parece a esto: estás afuera de un palacio enorme. Puedes ver las luces desde adentro. Sabes que hay algo valioso ahí. Y cada día haces lo que crees que debes hacer para que te dejen entrar.<br><br>Oras para que Dios te escuche. Sirves para que Dios te use. Lees la Biblia para que Dios no te olvide. Llegas a este tipo de reuniones esperando que algo pase.<br><br>Y no es hipocresía. Es genuino. Pero todo viene desde afuera, empujando hacia adentro.<br><br>¿Alguien reconoce esa sensación?</p>` },
      { t: "pregunta", html: "¿Alguna vez has servido en la iglesia sintiéndote más empleado que hijo? ¿Orando más por obligación que por conexión?" },
      { t: "guion", lbl: "El diagnóstico", html: `<p class="script">El problema no es falta de fe. No es falta de compromiso. El problema — y esto lo vamos a ver en el texto — es que muchos de nosotros no sabemos dónde estamos.<br><br>No sabemos que ya estamos adentro.</p>` },
      { t: "nota", html: "Dejar silencio después de la pregunta. No forzar respuesta verbal. El objetivo es que cada persona haga el diagnóstico internamente. Si alguien responde, acoge sin dramatizar." }
    ]
  },
  {
    label: "La preposición",
    tiempo: "15 – 24 min",
    bloques: [
      { t: "guion", lbl: "Punto 1 · la palabra más importante del NT", html: `<p class="script">Abran Efesios 1. Vamos a hacer algo simple: voy a leer los versículos 3 al 14, y quiero que cuenten cuántas veces aparece "en Cristo", "en él", "en el amado" o "en quien."<br><br><em>[Leer Efesios 1:3-14 despacio. Marcar con pausas cada "en él".]</em></p>` },
      { t: "verse", ref: "Efesios 1:3", texto: "Bendito sea el Dios y Padre de nuestro Señor Jesucristo, que nos bendijo con toda bendición espiritual en los lugares celestiales en Cristo." },
      { t: "guion", lbl: "", html: `<p class="script">¿Cuántos contaron? Doce. En catorce versículos. Si siguen leyendo el resto de Efesios, la frase aparece más de 30 veces. En todas las cartas de Pablo, más de 160 veces.<br><br>Pablo no está adornando. Tiene una obsesión. Y cuando un autor con la mente de Pablo se obsesiona con algo, vale la pena preguntarse por qué.<br><br>La respuesta es esta: para Pablo, la pregunta no es solamente si crees en Jesús. La pregunta es si estás en él.<br><br>Esas dos cosas no son lo mismo.</p>` },
      { t: "ilustra", html: `<strong>Ilustración — el avión:</strong> Hay una diferencia enorme entre creer que un avión puede volar y estar dentro del avión. Puedes estudiar aerodinámica por años. Puedes estar completamente convencido de que ese avión funciona. Pero solo cuando estás adentro, la física que lo sostiene te sostiene a ti también. "En Cristo" es eso. No es admirar a Jesús desde afuera. Es estar dentro de lo que él es.` },
      { t: "trans", html: "— Pero ¿qué significa exactamente estar 'en él'? Tres imágenes del Nuevo Testamento —" }
    ]
  },
  {
    label: "Las tres imágenes",
    tiempo: "24 – 36 min",
    bloques: [
      { t: "guion", lbl: "Imagen 1 · unión — Romanos 6:3-5", html: `<p class="script">La primera imagen es la más radical. Pablo dice algo en Romanos 6 que deberíamos escuchar como si fuera la primera vez:</p>` },
      { t: "verse", ref: "Romanos 6:3-4", texto: "¿O no saben que todos los que hemos sido bautizados en Cristo Jesús, hemos sido bautizados en su muerte? Porque somos sepultados juntamente con él para muerte... a fin de que como Cristo resucitó de los muertos... así también nosotros andemos en vida nueva." },
      { t: "guion", lbl: "", html: `<p class="script">Cuando Jesús murió, tú moriste. Cuando fue sepultado, fuiste sepultado. Cuando resucitó, resucitaste.<br><br>Esto no es una metáfora motivacional. Es una declaración de participación real. Lo que le pasó a él, te pasó a ti — porque estabas en él. Como cuando una persona está dentro de un barco que cruza el océano: la persona cruzó el océano. No porque ella remara. Porque estaba adentro.</p>` },
      { t: "trans", html: "— Segunda imagen —" },
      { t: "guion", lbl: "Imagen 2 · posición — Efesios 2:6", html: `<p class="script">La segunda imagen habla de dónde estás ahora mismo. En este momento.</p>` },
      { t: "verse", ref: "Efesios 2:6", texto: "Y juntamente con él nos resucitó, y asimismo nos hizo sentar en los lugares celestiales con Cristo Jesús." },
      { t: "guion", lbl: "", html: `<p class="script">Estás sentado con él. Ahora. No cuando mueras. No si llegas a ser suficientemente espiritual. Ahora.<br><br>Imagina que de repente estás en una reunión con alguien que tiene todo el poder y toda la autoridad. El acceso que tienes en esa reunión no lo tienes por tus méritos — lo tienes por tu posición en esa sala. La posición determina el acceso.<br><br>¿Cuál es tu posición? Sentado con Cristo. Eso no es orgullo espiritual. Es geografía.</p>` },
      { t: "dato", lbl: "Conexión con la investigación", html: `<p class="dato">La psicología dice que la continuidad del yo — sentirse la misma persona a través del tiempo y las circunstancias — está vinculada directamente a mayor bienestar, menor ansiedad y mayor estabilidad emocional. La identidad fragmentada genera inestabilidad. La identidad anclada, libera.<br><br><strong>En Cristo, la posición no cambia.</strong> No sube cuando oras bien. No baja cuando fallas. Es fija. Eso es el ancla más estable que puede existir.</p>` },
      { t: "trans", html: "— Tercera imagen —" },
      { t: "guion", lbl: "Imagen 3 · nueva creación — 2 Corintios 5:17", html: `<p class="script">La tercera imagen es la más conocida. Y quizás por eso la menos entendida.</p>` },
      { t: "verse", ref: "2 Corintios 5:17", texto: "De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas." },
      { t: "guion", lbl: "", html: `<p class="script">Nueva criatura. No versión mejorada. No tú con más esfuerzo y más disciplina. Nueva.<br><br>El error que cometemos es leer eso como una tarea: "debes llegar a ser nueva criatura." Pero Pablo lo dice en indicativo, no en imperativo. No es una orden. Es una declaración de algo que ya ocurrió.<br><br>No es "conviértete en nueva criatura." Es "ya eres nueva criatura — porque estás en Cristo."</p>` },
      { t: "ilustra", html: `<strong>Ilustración — los dos fumadores:</strong> Dos personas deciden dejar de fumar. En una fiesta, alguien les ofrece un cigarrillo. La primera dice: <em>"Estoy tratando de no fumar."</em> Tiene una batalla interna. Quizás resiste hoy. Quizás no mañana.<br><br>La segunda dice: <em>"No fumo."</em> No hay conflicto. No es lo que ella hace — porque no es quien ella es.<br><br>La diferencia no es la fuerza de voluntad. Es la identidad. Y Pablo está diciendo: en Cristo, tienes acceso a la segunda opción. No "estoy tratando de ser nueva criatura." Eres nueva criatura. El punto de referencia cambió.` },
      { t: "nota", html: "Este es el momento de mayor densidad teológica. Hablar más lento. Si hay pizarrón o pantalla: escribir las tres palabras — UNIÓN · POSICIÓN · NUEVA CREACIÓN — sin más. Dejar que esas tres palabras queden." }
    ]
  },
  {
    label: "Implicaciones",
    tiempo: "36 – 42 min",
    bloques: [
      { t: "guion", lbl: "El giro práctico · la pregunta que incomoda", html: `<p class="script">Entonces, ¿qué cambia?<br><br>Les voy a hacer una pregunta que puede ser incómoda. No tienen que responderla en voz alta. Solo que sea honesta internamente.<br><br>¿Cómo oran normalmente?<br><br>La mayoría de nosotros oramos así: "Señor, dame. Señor, ayúdame. Señor, ¿me escuchas? Señor, necesito que hagas algo." Es la oración de quien está afuera del palacio, tocando la puerta, esperando que alguien la abra.<br><br>Pero si estás en Cristo, si ya estás adentro, si ya estás sentado con él — la oración puede ser diferente. No "¿me darás acceso?" sino "Padre, gracias porque ya tengo acceso. Ayúdame a entender lo que ya me pertenece."</p>` },
      { t: "ilustra", html: `<strong>Ilustración — el hijo y el mendigo:</strong> Hay dos personas afuera de un palacio. Un mendigo que lleva años tocando la puerta, esperando que alguien le dé algo. Y un hijo del rey que salió a caminar y está llamando para que le abran.<br><br>Los dos están afuera. Los dos están llamando. Los dos necesitan que abran. Pero solo uno lo hace desde su identidad.<br><br>La diferencia no está en la puerta. Está en saber quién eres tú.` },
      { t: "puente", html: `<strong>Para los voluntarios específicamente:</strong> Si sirves en esta iglesia esperando que Dios te acepte, te use o te apruebe en base a lo que haces — estás sirviendo como mendigo. Si sirves desde la conciencia de que ya eres hijo, que ya estás en él, que ya tienes todo lo necesario — la misma acción se hace desde un lugar completamente diferente. Y eso cambia todo: la motivación, la sostenibilidad, la manera en que tratas a los demás cuando el servicio se pone difícil.` },
      { t: "nota", html: "No alargar este punto. La aplicación no necesita ser exhaustiva hoy — las próximas charlas desarrollarán cada identidad específica. Lo que necesita quedar claro es el principio: la posición precede la conducta." }
    ]
  },
  {
    label: "Cierre",
    tiempo: "42 – 45 min",
    bloques: [
      { t: "guion", lbl: "Ejercicio de cierre", html: `<p class="script">Para terminar, quiero que hagamos algo juntos.<br><br>Vamos a volver a Efesios 1:3-14. Esta vez no lo voy a leer yo. Voy a pedirles que lo lean internamente, en silencio, muy despacio. Y cada vez que encuentren "en él", "en Cristo", "en el amado" — quiero que hagan una pausa y se hagan esta pregunta: ¿esto me pertenece a mí?<br><br><em>[2 minutos de silencio real. No llenar el silencio. No apresurarlo.]</em></p>` },
      { t: "pregunta", html: "Pregunta para llevar a la semana: ¿Cuál es la promesa de Dios que más me cuesta recibir como ya mía — en lugar de como algo que todavía debo ganarme?" },
      { t: "guion", lbl: "Cierre y anticipación", html: `<p class="script">La próxima vez vamos a ver las dos primeras identidades que vienen de estar en Cristo: ser hijos adoptados, y ser miembros de un cuerpo.<br><br>Pero ya saben que no vamos a hablar de cosas que deben aspirar a ser. Vamos a hablar de cosas que ya son — y de lo que eso cambia en cómo viven.<br><br>Oremos.</p>` },
      { t: "nota", html: `Oración de cierre — breve, declarativa, en primera persona del plural. Modelo: "Padre, gracias porque no estamos afuera esperando. Gracias porque estamos en Cristo — porque lo que le pasó a él nos pasó a nosotros. Ayúdanos esta semana a vivir desde adentro, no desde afuera. Amén."<br><br><strong>No pedir nada en la oración de cierre.</strong> Que la oración misma sea un ejemplo de lo que acaban de aprender.` }
    ]
  }
];

const nav = document.getElementById('nav');
const prog = document.getElementById('prog');
const panels = document.getElementById('panels');
let cur = 0;

function render(i) {
  cur = i;
  nav.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', j===i));
  prog.querySelectorAll('.ps').forEach((s,j) => {
    s.classList.toggle('done', j < i);
    s.classList.toggle('cur', j === i);
  });
  panels.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', j===i));
}

secs.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nb';
  btn.textContent = s.label;
  btn.onclick = () => render(i);
  nav.appendChild(btn);

  const ps = document.createElement('div');
  ps.className = 'ps';
  prog.appendChild(ps);

  const panel = document.createElement('div');
  panel.className = 'panel';

  let html = `<div class="tbadge"><i class="ti ti-clock" aria-hidden="true"></i>${s.tiempo}</div>`;

  s.bloques.forEach(b => {
    if (b.t === 'contexto' || b.t === 'guion') {
      html += `<div class="blk"><div class="blk-hd">${b.lbl || 'Guión'}</div><div class="blk-bd">${b.html}</div></div>`;
    } else if (b.t === 'nota') {
      html += `<div class="nota">${b.html}</div>`;
    } else if (b.t === 'verse') {
      html += `<blockquote class="verse">${b.texto}<cite>${b.ref}</cite></blockquote>`;
    } else if (b.t === 'pregunta') {
      html += `<div class="pregunta">${b.html}</div>`;
    } else if (b.t === 'ilustra') {
      html += `<div class="ilustra">${b.html}</div>`;
    } else if (b.t === 'dato') {
      html += `<div class="dato blk"><div class="blk-hd">${b.lbl || 'Dato · psicología'}</div><div class="blk-bd">${b.html}</div></div>`;
    } else if (b.t === 'puente') {
      html += `<div class="puente">${b.html}</div>`;
    } else if (b.t === 'trans') {
      html += `<p class="trans">${b.html}</p>`;
    }
  });

  html += `<div class="navbtns">
    <button class="navb" ${i===0?'disabled':''} onclick="render(${i-1})">&larr; Anterior</button>
    <button class="navb" ${i===secs.length-1?'disabled':''} onclick="render(${i+1})">Siguiente &rarr;</button>
  </div>`;

  panel.innerHTML = html;
  panels.appendChild(panel);
});

render(0);
</script>
