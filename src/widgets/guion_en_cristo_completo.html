const secs = [
  {
    label: "Intro",
    tiempo: "0 – 7 min",
    bloques: [
      { t: "blk", lbl: "Ubica la serie", html: `<p class="script">Llevamos varias charlas recorriendo la historia de Dios con la humanidad. El Reino, la caída, la ley, los sacrificios, el templo — y llegamos hasta Jesús, que cumplió con todo eso.<br><br>Pero ahora queda una pregunta en el aire: ¿y yo qué? ¿Qué cambió para mí cuando Jesús hizo lo que hizo?<br><br>Las próximas tres charlas van a responder eso. Hoy vamos con el fundamento — lo que hace posible todo lo demás.</p>` },
      { t: "blk", lbl: "Gancho de apertura", html: `<p class="script">Quiero empezar con un experimento. Cierra los ojos un segundo. <em>[Pausa 5 seg.]</em> Piensa en la última vez que alguien te dijo algo sobre quién eres tú. Algo bueno, o algo difícil.<br><br>¿Cuánto tiempo duró ese comentario en tu cabeza?<br><br>La psicología tiene una respuesta bastante incómoda a esa pregunta. Y esta noche vamos a conectar esa respuesta con algo que Pablo escribió hace 2000 años.</p>` },
      { t: "dato", html: `La investigación de las últimas décadas es clara: <strong>la identidad no es el resultado del comportamiento — es su causa.</strong> Lo que crees que eres determina cómo actúas, no al revés. Una persona que se cree atleta va al gimnasio cuando llueve. Una que "está intentando hacer ejercicio" siempre encuentra una razón para no ir. La diferencia no es la disciplina. Es la identidad.<br><br>Si eso es cierto en cualquier área de la vida, ¿qué significa tener una identidad que no depende de lo que hagas, de lo que sientas, de lo que los demás digan?` },
      { t: "nota", html: "Tono: curioso, no predicador. Como quien comparte un descubrimiento. Esto baja la resistencia en adultos que ya han escuchado muchas charlas de iglesia." }
    ]
  },
  {
    label: "El problema",
    tiempo: "7 – 15 min",
    bloques: [
      { t: "blk", lbl: "Diagnóstico honesto", html: `<p class="script">Antes de entrar al texto, necesito que pensemos en algo que pasa mucho adentro de la iglesia. Quizás en nosotros.<br><br>Hay una manera de seguir a Dios que se parece a esto: estás afuera de un palacio enorme. Sabes que hay algo valioso ahí. Y cada día haces lo que crees que debes hacer para que te dejen entrar.<br><br>Oras para que Dios te escuche. Sirves para que Dios te use. Lees la Biblia para que Dios no te olvide. Todo desde afuera, empujando hacia adentro.</p>` },
      { t: "pregunta", html: "¿Alguna vez has servido en la iglesia sintiéndote más empleado que hijo? ¿Orando más por obligación que por conexión?" },
      { t: "blk", lbl: "", html: `<p class="script">El problema no es falta de fe. El problema — y esto lo vamos a ver en el texto — es que muchos de nosotros no sabemos dónde estamos.<br><br>No sabemos que ya estamos adentro.</p>` },
      { t: "nota", html: "Dejar silencio después de la pregunta. No forzar respuesta verbal." }
    ]
  },
  {
    label: "La preposición",
    tiempo: "15 – 24 min",
    bloques: [
      { t: "blk", lbl: "La palabra más importante del NT", html: `<p class="script">Abran Efesios 1. Voy a leer los versículos 3 al 14. Cuenten cuántas veces aparece "en Cristo", "en él", "en el amado" o "en quien."<br><br><em>[Leer Efesios 1:3-14 despacio. Pausar en cada "en él".]</em><br><br>¿Cuántos contaron? Doce. En catorce versículos. En todas las cartas de Pablo, más de 160 veces.<br><br>Pablo no está adornando. Para él, la pregunta no es solamente si crees en Jesús. La pregunta es si estás en él. Y esas dos cosas no son lo mismo.</p>` },
      { t: "verse", ref: "Efesios 1:3", texto: "Bendito sea el Dios y Padre de nuestro Señor Jesucristo, que nos bendijo con toda bendición espiritual en los lugares celestiales en Cristo." },
      { t: "ilustra", html: `<strong>Ilustración — el avión:</strong> Hay una diferencia enorme entre creer que un avión puede volar y estar dentro del avión. Solo cuando estás adentro, la física que lo sostiene te sostiene a ti también. "En Cristo" es eso — no es admirar a Jesús desde afuera. Es estar dentro de lo que él es.` },
      { t: "trans", html: "— ¿Qué significa exactamente estar 'en él'? Cuatro dimensiones —" }
    ]
  },
  {
    label: "Las dimensiones",
    tiempo: "24 – 37 min",
    bloques: [
      { t: "blk", lbl: "Dimensión 1 · herencia compartida", html: `<p class="script">Lo primero que significa estar en Cristo es que su historia ahora cuenta como tuya.<br><br>Pablo lo dice de varias maneras a lo largo de sus cartas, pero la imagen más radical está en Gálatas:</p>` },
      { t: "verse", ref: "Gálatas 2:20", texto: "Con Cristo estoy juntamente crucificado, y ya no vivo yo, mas vive Cristo en mí." },
      { t: "blk", lbl: "", html: `<p class="script">No dice "quiero llegar a ser crucificado con Cristo." Dice "estoy juntamente crucificado" — tiempo pasado, hecho consumado. Y Romanos 6 lo amplía:</p>` },
      { t: "verse", ref: "Romanos 6:4", texto: "Somos, pues, sepultados con él para muerte por el bautismo, a fin de que como Cristo resucitó de los muertos... así también nosotros andemos en vida nueva." },
      { t: "blk", lbl: "", html: `<p class="script">Cuando Jesús murió, tú moriste. Cuando resucitó, resucitaste. No como metáfora — como participación real. Lo que le pasó a él te pasó a ti, porque estabas en él. Y eso tiene consecuencias enormes: como dice 1 Corintios 3, todo lo que tiene Cristo es tuyo — no como favor, sino como herencia.</p>` },
      { t: "trans", html: "— Segunda dimensión —" },
      { t: "blk", lbl: "Dimensión 2 · nueva creación + identidad escondida", html: `<p class="script">La segunda dimensión tiene que ver con lo que eres ahora.</p>` },
      { t: "verse", ref: "2 Corintios 5:17", texto: "De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas." },
      { t: "verse", ref: "Colosenses 3:3", texto: "Porque habéis muerto, y vuestra vida está escondida con Cristo en Dios." },
      { t: "blk", lbl: "", html: `<p class="script">Nueva criatura — no versión mejorada. Y "vuestra vida está escondida con Cristo en Dios" — eso significa que tu identidad más profunda no es visible ni vulnerable. No puede ser atacada, quitada ni dañada por lo que otros digan o hagan.<br><br>El error es leer "nueva criatura" como una tarea: "debes llegar a serlo." Pablo lo dice en indicativo, no en imperativo. No es una orden. Es una declaración de lo que ya ocurrió.</p>` },
      { t: "ilustra", html: `<strong>Ilustración — los dos fumadores:</strong> Dos personas deciden dejar de fumar. La primera dice: <em>"Estoy tratando de no fumar."</em> Tiene una batalla interna cada vez que alguien ofrece un cigarrillo. La segunda dice: <em>"No fumo."</em> No hay conflicto — no es lo que ella hace, porque no es quien ella es.<br><br>La diferencia no es la fuerza de voluntad. Es la identidad. Pablo dice: en Cristo, tienes acceso a la segunda opción.` },
      { t: "trans", html: "— Tercera dimensión —" },
      { t: "blk", lbl: "Dimensión 3 · seguridad absoluta — el ancla", html: `<p class="script">La tercera dimensión es la que más necesitamos escuchar cuando fallamos, cuando dudamos, cuando la voz interna dice que no somos suficientes.</p>` },
      { t: "verse", ref: "Romanos 8:1", texto: "Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús." },
      { t: "verse", ref: "Hebreos 6:19", texto: "La cual tenemos como segura y firme ancla del alma, y que penetra hasta dentro del velo." },
      { t: "blk", lbl: "", html: `<p class="script">El ancla no es tu comportamiento. No es tu nivel de fe. No es cuánto sirves. El ancla es la promesa de Dios en Cristo — y Hebreos dice que esa promesa penetra hasta el lugar más santo, hasta la presencia misma de Dios.<br><br>Y Romanos 8:38-39 no deja escapatoria: nada — ni lo presente, ni lo por venir, ni lo alto, ni lo profundo — puede separarte del amor de Dios que es en Cristo Jesús.</p>` },
      { t: "dato", html: `La psicología confirma que la <strong>continuidad del yo</strong> — sentirse la misma persona a través del tiempo y las circunstancias — es uno de los predictores más fuertes de bienestar y salud mental. La identidad fragmentada genera ansiedad. La identidad anclada, libera.<br><br>En Cristo, tu identidad no sube cuando oras bien ni baja cuando fallas. Es fija. Es el ancla más estable que puede existir.` },
      { t: "trans", html: "— Cuarta dimensión —" },
      { t: "blk", lbl: "Dimensión 4 · acceso directo a Dios", html: `<p class="script">La cuarta dimensión es la más práctica para cómo oramos y cómo vivimos.</p>` },
      { t: "verse", ref: "Hebreos 4:16", texto: "Acerquémonos, pues, confiadamente al trono de la gracia, para alcanzar misericordia y hallar gracia para el oportuno socorro." },
      { t: "verse", ref: "Efesios 2:18", texto: "Porque por medio de él los unos y los otros tenemos entrada por un mismo Espíritu al Padre." },
      { t: "blk", lbl: "", html: `<p class="script">"Confiadamente" — en el griego original es <em>parresia</em>: libertad de expresión total, sin miedo al rechazo. No es el acceso cauteloso del empleado ante su jefe. Es el acceso del hijo ante su padre.<br><br>Y Filipenses 3:20 añade algo que cambia cómo te ubicas en el mundo: "nuestra ciudadanía está en los cielos." No como escape del mundo — como identidad fundamental que informa todo lo que haces en él.</p>` },
      { t: "nota", html: "Este es el momento de mayor densidad. Hablar más lento. Si hay pizarrón: escribir HERENCIA · NUEVA CREACIÓN · ANCLA · ACCESO. Cuatro palabras que resumen las cuatro dimensiones." }
    ]
  },
  {
    label: "Implicaciones",
    tiempo: "37 – 42 min",
    bloques: [
      { t: "blk", lbl: "El giro práctico", html: `<p class="script">Entonces, ¿qué cambia concrétamente?<br><br>Una pregunta honesta: ¿cómo oras normalmente? La mayoría oramos así: "Señor, dame. Señor, ayúdame. Señor, ¿me escuchas?" Es la oración del que está afuera tocando la puerta.<br><br>Pero si tienes herencia, si eres nueva criatura, si el ancla es firme, si tienes acceso — la oración puede ser diferente. No "¿me darás acceso?" sino "Padre, gracias porque ya tengo acceso. Ayúdame a entender lo que ya me pertenece."</p>` },
      { t: "ilustra", html: `<strong>Ilustración — el hijo y el mendigo:</strong> Dos personas afuera de un palacio. Un mendigo que lleva años tocando la puerta esperando que alguien le dé algo. Y un hijo del rey que salió a caminar y está llamando para que le abran.<br><br>Los dos están afuera. Los dos están llamando. Pero solo uno lo hace desde su identidad. La diferencia no está en la puerta — está en saber quién eres tú.` },
      { t: "puente", html: `<strong>Para los voluntarios:</strong> Si sirves esperando que Dios te acepte, te use o te apruebe en base a lo que haces — estás sirviendo como mendigo. Si sirves desde la conciencia de que ya tienes herencia, que ya eres nueva criatura, que el ancla es firme — la misma acción se hace desde un lugar completamente diferente. Cambia la motivación, la sostenibilidad, la manera en que tratas a los demás cuando el servicio se pone difícil.` },
      { t: "nota", html: "No extender este punto. La aplicación específica de cada identidad viene en las charlas 2 y 3. Lo que debe quedar hoy es el principio: la posición precede la conducta." }
    ]
  },
  {
    label: "Cierre",
    tiempo: "42 – 45 min",
    bloques: [
      { t: "blk", lbl: "Ejercicio de cierre", html: `<p class="script">Para terminar, vamos a hacer algo juntos.<br><br>Vuelvan a Efesios 1:3-14. Léanlo internamente, en silencio, muy despacio. Cada vez que encuentren "en él", "en Cristo", "en el amado" — hagan una pausa y pregunten: ¿esto me pertenece a mí?<br><br><em>[2 minutos de silencio real. No llenar el silencio.]</em></p>` },
      { t: "pregunta", html: "Pregunta para la semana: ¿Cuál de estas cuatro dimensiones — herencia, nueva creación, ancla, acceso — me cuesta más recibir como ya mía, en lugar de como algo que debo ganarme?" },
      { t: "blk", lbl: "Anticipación", html: `<p class="script">La próxima vez vamos a ver las dos primeras identidades que vienen de estar en Cristo: hijos adoptados y miembros de un cuerpo. No vamos a hablar de cosas a las que deben aspirar. Vamos a hablar de cosas que ya son — y de lo que eso cambia.<br><br>Oremos.</p>` },
      { t: "nota", html: `Oración de cierre — breve, declarativa. Modelo: "Padre, gracias porque no estamos afuera esperando. Estamos en Cristo. Tenemos herencia, somos nueva creación, tenemos ancla, tenemos acceso. Ayúdanos esta semana a vivir desde adentro. Amén." — No pedir nada. Que la oración misma sea un ejemplo de lo que aprendieron.` }
    ]
  },
  {
    label: "Material de estudio",
    tiempo: "Para el voluntario",
    esEstudio: true,
    bloques: []
  }
];

const nav = document.getElementById('nav');
const prog = document.getElementById('prog');
const panelsEl = document.getElementById('panels');
let cur = 0;

function render(i) {
  cur = i;
  nav.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', j===i));
  prog.querySelectorAll('.ps').forEach((s,j) => {
    s.classList.toggle('done', j < i);
    s.classList.toggle('cur', j === i);
  });
  panelsEl.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', j===i));
}

secs.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nb';
  btn.textContent = s.label;
  btn.onclick = () => render(i);
  nav.appendChild(btn);
  const ps = document.createElement('div');
  ps.className = 'ps';
  prog.appendChild(ps);

  const panel = document.createElement('div');
  panel.className = 'panel';

  let html = `<div class="tbadge"><i class="ti ti-clock" aria-hidden="true"></i>${s.tiempo}</div>`;

  if (s.esEstudio) {
    html += `<p class="estudio-lede">Este material no se dicta en la charla. Se entrega o comparte digitalmente para que cada voluntario lo estudie en la semana. Cada bloque incluye los versículos completos y una pregunta de reflexión personal.</p>`;
    bloques_estudio.forEach((b, bi) => {
      html += `<div class="estudio-blk">
        <div class="estudio-hd" onclick="toggleEstudio(${bi})">
          <span class="estudio-num">${b.num}</span>
          <div style="flex:1">
            <div class="estudio-title">${b.title}</div>
            <div class="estudio-desc">${b.desc}</div>
          </div>
          <span class="estudio-arrow" id="earr-${bi}">▶</span>
        </div>
        <div class="estudio-body" id="ebody-${bi}">
          ${b.versiculos.map(v => `<div class="estudio-verse">${v.texto}<cite>${v.ref}</cite></div>`).join('')}
          <div class="estudio-aplicacion">${b.aplicacion}</div>
        </div>
      </div>`;
    });
  } else {
    s.bloques.forEach(b => {
      if (b.t === 'blk') {
        html += b.lbl
          ? `<div class="blk"><div class="blk-hd">${b.lbl}</div><div class="blk-bd">${b.html}</div></div>`
          : `<div class="blk"><div class="blk-bd">${b.html}</div></div>`;
      } else if (b.t === 'nota') {
        html += `<div class="nota">${b.html}</div>`;
      } else if (b.t === 'verse') {
        html += `<blockquote class="verse">${b.texto}<cite>${b.ref}</cite></blockquote>`;
      } else if (b.t === 'pregunta') {
        html += `<div class="pregunta">${b.html}</div>`;
      } else if (b.t === 'ilustra') {
        html += `<div class="ilustra">${b.html}</div>`;
      } else if (b.t === 'dato') {
        html += `<div class="dato">${b.html}</div>`;
      } else if (b.t === 'puente') {
        html += `<div class="puente">${b.html}</div>`;
      } else if (b.t === 'trans') {
        html += `<p class="trans">${b.html}</p>`;
      }
    });
  }

  html += `<div class="navbtns">
    <button class="navb" ${i===0?'disabled':''} onclick="render(${i-1})">&larr; Anterior</button>
    <button class="navb" ${i===secs.length-1?'disabled':''} onclick="render(${i+1})">Siguiente &rarr;</button>
  </div>`;

  panel.innerHTML = html;
  panelsEl.appendChild(panel);
});

function toggleEstudio(i) {
  const body = document.getElementById('ebody-' + i);
  const arr = document.getElementById('earr-' + i);
  const open = body.classList.toggle('open');
  arr.classList.toggle('open', open);
}

render(0);
</script>
