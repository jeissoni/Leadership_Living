
<style>

<div class="nav" id="nav"></div>

<div id="panels"></div>

<script>
const secs = [
  {
    label: "Apertura",
    tiempo: "0 – 5 min",
    bloques: [
      { t: "blk", lbl: "Puente con la charla anterior", html: `<p class="script">La última vez hablamos de estar en Cristo — de que nuestra posición lo cambia todo. Que no es lo mismo creer en Jesús desde afuera que estar dentro de lo que él es.<br><br>Hoy la pregunta avanza: si estás en Cristo, ¿a quién tienes como Padre?<br><br>Y para responder esa pregunta bien, necesitamos hacer un recorrido. Porque el Dios que Jesús llama Padre no apareció de la nada en el Nuevo Testamento. Tiene historia. Tiene nombre. Tiene carácter revelado a lo largo de siglos.<br><br>Así que vamos a hacer algo que quizás no esperaban: vamos a empezar en el Antiguo Testamento.</p>` },
      { t: "nota", html: "Tono: de exploración, no de clase magistral. La idea es que el grupo redescubra lo que ya conoce con ojos nuevos. Si conocen bien el AT, el recorrido será de reconocimiento y profundización, no de novedad." }
    ]
  },
  {
    label: "Nombres de Dios",
    tiempo: "5 – 20 min",
    bloques: [
      { t: "blk", lbl: "Los nombres como revelación", html: `<p class="script">En el mundo bíblico, un nombre no es solo una etiqueta. Es una revelación de carácter. Cuando Dios revela su nombre, está revelando quién es — y cómo quiere que nos relacionemos con él.<br><br>Vamos a ver cuatro nombres del Antiguo Testamento. Y quiero que noten algo mientras los vemos: ¿qué tipo de relación propone cada uno?</p>` },
      {
        t: "nombres", items: [
          {
            nombre: "Elohim", color: "#534AB7", bg: "#EEEDFE",
            significado: "Dios — el Creador poderoso",
            ref: "Génesis 1:1",
            verso: "En el principio creó Dios los cielos y la tierra.",
            desc: `<strong>Elohim</strong> es el nombre con el que comienza todo. Es plural en hebreo — no porque haya varios dioses, sino para expresar la plenitud de su poder. El Dios que habla y la nada se convierte en algo.<br><br>La relación que propone: Creador–criatura. Hay una distancia inherente. Él es el origen de todo. Nosotros somos lo que él hizo. La reverencia es la respuesta natural.`
          },
          {
            nombre: "El Shaddai", color: "#0F6E56", bg: "#E1F5EE",
            significado: "Dios Todopoderoso — el que sustenta",
            ref: "Génesis 17:1",
            verso: "Era Abram de edad de noventa y nueve años, cuando le apareció el Señor y le dijo: Yo soy el Dios Todopoderoso; anda delante de mí y sé perfecto.",
            desc: `<strong>El Shaddai</strong> aparece en los momentos de promesa imposible. A Abraham, cuando su cuerpo ya no podía. A Job, en medio del sufrimiento. Es el Dios que tiene poder sobre lo que está más allá del poder humano.<br><br>La relación que propone: Omnipotente–dependiente. Él puede lo que yo no puedo. La postura es de rendición y confianza ante el que no tiene límites.`
          },
          {
            nombre: "YHWH", color: "#993C1D", bg: "#FAECE7",
            significado: "El que Es — el Dios del pacto",
            ref: "Éxodo 3:14",
            verso: "Y respondió Dios a Moisés: YO SOY EL QUE SOY. Y dijo: Así dirás a los hijos de Israel: YO SOY me envió a vosotros.",
            desc: `<strong>YHWH</strong> — el nombre tan sagrado que los judíos no lo pronunciaban. El tetragrámaton. El nombre del pacto, el nombre personal de Dios con su pueblo.<br><br>Aquí algo cambia: este nombre no habla solo de poder sino de relación. YHWH es el Dios que se compromete, que hace pacto, que no abandona. Pero sigue siendo un nombre de tremenda santidad — los sacerdotes se purificaban antes de escribirlo.<br><br>La relación que propone: Santo–pueblo. Hay cercanía de pacto, pero mediada. Nadie entra al Lugar Santísimo excepto el sumo sacerdote, una vez al año, con sangre.`
          },
          {
            nombre: "Adonai", color: "#185FA5", bg: "#E6F1FB",
            significado: "Señor — el que tiene autoridad soberana",
            ref: "Salmo 8:1",
            verso: "¡Oh Señor, Señor nuestro, cuán glorioso es tu nombre en toda la tierra!",
            desc: `<strong>Adonai</strong> es el nombre que los judíos usaban en voz alta en lugar de YHWH cuando leían las Escrituras. Señor, soberano, amo. Reconoce su autoridad total sobre todo lo que existe.<br><br>La relación que propone: Soberano–súbdito. El que obedece y sirve porque reconoce quién tiene el gobierno de todo.`
          }
        ]
      },
      { t: "blk", lbl: "El patrón que emerge", html: `<p class="script">¿Notaron el patrón? Elohim: Creador–criatura. El Shaddai: Todopoderoso–dependiente. YHWH: Santo–pueblo mediado. Adonai: Soberano–súbdito.<br><br>Cada nombre revela algo real y verdadero de Dios. No son incorrectos. Son parte de quien él es.<br><br>Pero hay algo que falta en todos ellos.<br><br>En ninguno de estos nombres la relación propuesta es íntima. Hay reverencia, hay pacto, hay dependencia, hay obediencia. Pero no hay lo que Jesús trae.</p>` },
      { t: "trans", html: "— Y entonces llega Jesús —" }
    ]
  },
  {
    label: "El giro de Jesús",
    tiempo: "20 – 28 min",
    bloques: [
      { t: "giro", html: `<div class="giro-lbl">El giro más radical del NT</div><div class="giro-txt">Jesús no enseña un nombre nuevo de Dios. Hace algo más radical: toma al Dios de Abraham, de Moisés, del Sinaí — el Elohim, el YHWH, el Adonai — y lo llama Abba.</div>` },
      { t: "blk", lbl: "Lo que Jesús hizo con los nombres", html: `<p class="script">En el Sermón del Monte, Jesús no dice "cuando oren, digan: Oh Elohim todopoderoso." Dice:</p>` },
      { t: "verse", ref: "Mateo 6:9", texto: "Vosotros, pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre." },
      { t: "blk", lbl: "", html: `<p class="script">Padre. No como una metáfora poética — el AT sí tiene imágenes paternas de Dios, pero siempre colectivas, siempre distantes. Jesús lo convierte en el modo primario de dirigirse a Dios. Y no dice "Padre de Abraham" o "Padre de Israel." Dice "Padre nuestro." Personal. Plural. Para todos los que están en él.<br><br>Y en su propio momento más vulnerable, en Getsemaní, cuando el peso del mundo estaba sobre él, Jesús no recurre a Elohim ni a Adonai. Recurre al nombre más íntimo:</p>` },
      { t: "verse", ref: "Marcos 14:36", texto: "Y decía: Abba, Padre, todas las cosas son posibles para ti; aparta de mí esta copa; mas no lo que yo quiero, sino lo que tú." },
      { t: "dato", html: `<strong>Abba — lo que significa esta palabra:</strong><br><br>Es arameo, no hebreo formal. Era la lengua de la casa, no del templo. La palabra que un niño usaba en la intimidad familiar — lo más cercano a "Papá" en español cotidiano.<br><br>Ningún judío del primer siglo se habría atrevido a usar esa palabra con Dios. Era demasiado cercana, demasiado familiar para el Dios que hacía temblar el Sinaí. Jesús no solo la usa — nos dice que nosotros también podemos usarla.<br><br>Pablo la preserva transliterada en sus cartas en griego — no la tradujo — precisamente porque era una palabra que la iglesia temprana usaba en la oración. Era parte de cómo se relacionaban con Dios.` },
      { t: "verse", ref: "Romanos 8:15", texto: "Pues no habéis recibido el espíritu de esclavitud para estar otra vez en temor, sino que habéis recibido el espíritu de adopción, por el cual clamamos: ¡Abba, Padre!" },
      { t: "blk", lbl: "La adopción — huiothesia", html: `<p class="script">¿Cómo llegamos nosotros a tener acceso a ese nombre? Eso es lo que Pablo explica con la palabra adopción — en griego, huiothesia.<br><br>Y aquí hay algo que el contexto cultural ilumina enormemente.</p>` },
      { t: "ilustra", html: `<strong>La adopción romana — tres detalles que cambian todo:</strong><br><br><strong>1. Se adoptaba principalmente a adultos.</strong> Un ciudadano romano poderoso sin heredero podía adoptar a un adulto. El adoptado dejaba completamente su familia anterior. Deudas anteriores: canceladas legalmente. Historia anterior: borrada. Identidad nueva: total.<br><br><strong>2. El adoptado tenía exactamente los mismos derechos que el hijo natural.</strong> No era hijo de segunda clase. Misma herencia, mismo apellido, mismo acceso al padre. Igual en todo ante la ley.<br><br><strong>3. La iniciativa siempre era del padre.</strong> No era el adoptado quien buscaba familia — era el padre quien elegía. Esto no era rescate de lástima. Era elección deliberada.` },
      { t: "verse", ref: "Efesios 1:4-5", texto: "Según nos escogió en él antes de la fundación del mundo... habiéndonos predestinado para ser adoptados hijos suyos por medio de Jesucristo, según el puro afecto de su voluntad." },
      { t: "blk", lbl: "", html: `<p class="script">No nos recogió porque nos vio solos y tuvo lástima. Nos eligió. Antes de la fundación del mundo.<br><br>Y al adoptarnos, hizo exactamente lo que la adopción romana hacía: canceló la deuda anterior, borró la historia de esclavitud al pecado, y nos dio acceso pleno a todo lo que tiene. No como hijos de segunda clase. Como coherederos con el Hijo.<br><br>El Elohim que creó los cielos y la tierra — ese mismo Dios — ahora es Abba para ti.</p>` },
      { t: "trans", html: "— Y ahora Jesús nos cuenta cómo se ve ese Padre en acción —" }
    ]
  },
  {
    label: "El Padre que corre",
    tiempo: "28 – 40 min",
    bloques: [
      { t: "blk", lbl: "La parábola del hijo pródigo — Leer Lucas 15:11-24", html: `<p class="script">Quiero que leamos juntos esta parábola. Y quiero pedirles algo: intenten escucharla como si fuera la primera vez. No como un texto que ya conocen, sino como Jesús contándola a personas que nunca la habían escuchado.<br><br><em>[Leer Lucas 15:11-24 en voz alta, despacio. Si es posible, una voz diferente a la del presentador.]</em><br><br>Quiero detenerme en cada uno de los tres personajes. Porque Jesús pone algo específico en cada uno.</p>` },
      { t: "parabola", items: [
        { icon: "👦", title: "El hijo menor — el que se fue", body: "Pide su herencia en vida, que en la cultura del primer siglo equivalía a desear la muerte del padre. Se va, lo pierde todo, vuelve con un discurso ensayado: 'ya no soy digno de ser llamado tu hijo, hazme como a uno de tus jornaleros.' Viene con la mentalidad de empleado — lo mejor que puede ofrecer es trabajo a cambio de techo." },
        { icon: "👴", title: "El padre — el que corre", body: "Lo ve cuando aún está lejos. Eso significa que estaba mirando. Que no lo había dado por perdido. Y corre — en la cultura del primer siglo, un hombre de honor no corría. Era indignidad pública. El padre sacrifica su reputación para llegar más rápido a su hijo. Llega antes del discurso. Interrumpe el discurso. La fiesta comienza antes de que el hijo termine de hablar." },
        { icon: "👦", title: "El hijo mayor — el que se quedó", body: "Está afuera, enojado. No quiere entrar. Y lo que dice revela todo: 'He servido todos estos años sin desobedecer tus mandamientos, y nunca me has dado un cabrito para celebrar.' Llevaba años en la casa del padre — pero viviendo como empleado, no como hijo. La fiesta del hermano lo expone: nunca había pedido lo que siempre tuvo disponible." }
      ]},
      { t: "blk", lbl: "Lo que la parábola revela del Padre", html: `<p class="script">Jesús está respondiendo una pregunta muy específica que los fariseos tenían sobre él: ¿por qué comes con pecadores? ¿Por qué los buscas?<br><br>Y la respuesta es esta parábola. El Padre busca. El Padre mira cuando el hijo todavía está lejos. El Padre corre.<br><br>Pero fíjense en un detalle que es fácil perder: hay dos hijos perdidos en esta historia. El menor se perdió en el mundo. El mayor se perdió en la casa del padre.<br><br>El hijo mayor tiene acceso a todo y no usa nada. Lleva años al lado del padre sin pedirle un cabrito para celebrar con sus amigos. ¿Por qué? Porque no vive como hijo. Vive como empleado.</p>` },
      { t: "verse", ref: "Lucas 15:31", texto: "Él entonces le dijo: Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas." },
      { t: "blk", lbl: "", html: `<p class="script">"Todas mis cosas son tuyas." Las mismas palabras de 1 Corintios 3 que vimos la última vez: "todo es vuestro... y vosotros de Cristo, y Cristo de Dios."<br><br>El hijo mayor tenía todo disponible y no lo sabía. O lo sabía con la cabeza pero no lo vivía con el corazón.<br><br>Esa es la pregunta que Jesús deja abierta al final de la parábola: ¿va a entrar el hijo mayor? ¿Va a recibir la identidad que siempre tuvo disponible?<br><br>Jesús no cierra la historia. La deja abierta. Porque la respuesta la damos nosotros.</p>` },
      { t: "pregunta", html: "¿Con cuál de los dos hijos te identificas más esta semana? ¿Con el que se fue lejos y está volviendo? ¿O con el que lleva años en la casa del padre pero viviendo como empleado?" },
      { t: "nota", html: "Esta pregunta es el momento más importante de la charla. Dejar 30-40 segundos de silencio real. No llenar el espacio. El objetivo no es que respondan en voz alta — es que cada uno lo procese internamente." }
    ]
  },
  {
    label: "Implicaciones",
    tiempo: "40 – 43 min",
    bloques: [
      { t: "blk", lbl: "El recorrido completo", html: `<p class="script">Hagamos el recorrido que hicimos hoy:<br><br>Elohim — el Creador. El Dios de la distancia necesaria, la reverencia apropiada.<br>El Shaddai — el Todopoderoso. El Dios que puede lo que yo no puedo.<br>YHWH — el Dios del pacto. Que se compromete, que no abandona.<br>Adonai — el Soberano. Al que se sirve y se obedece.<br><br>Todo eso sigue siendo verdad. Sigue siendo parte de quién es Dios.<br><br>Y luego viene Jesús. Y dice: todo eso que conocen — ese Dios — corre hacia ti cuando lo ves desde lejos. Ese Dios interrumpe tu discurso ensayado para darte un abrazo. Ese Dios está mirando desde lejos esperando que vuelvas.</p>` },
      { t: "puente", html: `<strong>Para los voluntarios específicamente:</strong><br><br>El hijo mayor de la parábola servía bien. Hacía todo lo correcto. No desobedeció ningún mandamiento. Pero lo hacía desde el lugar equivocado — desde la obligación, no desde la filiación.<br><br>Si llevas tiempo sirviendo en esta iglesia y hay resentimiento, cansancio, necesidad de reconocimiento — no es porque seas malo. Es porque quizás estás sirviendo como el hijo mayor. Tienes todo disponible. "Todas mis cosas son tuyas." La pregunta es si estás viviendo desde eso.` },
      { t: "verse", ref: "Gálatas 4:6-7", texto: "Y por cuanto sois hijos, Dios envió a vuestros corazones el Espíritu de su Hijo, el cual clama: ¡Abba, Padre! Así que ya no eres esclavo, sino hijo; y si hijo, también heredero de Dios por medio de Cristo." }
    ]
  },
  {
    label: "Cierre",
    tiempo: "43 – 45 min",
    bloques: [
      { t: "blk", lbl: "Ejercicio de cierre", html: `<p class="script">Para cerrar, quiero que hagamos algo simple pero que requiere valentía.<br><br>Voy a pedirles que oren. No con palabras elaboradas. Solo quiero que digan — en voz baja, internamente, como sea que les salga — dos palabras.<br><br><strong>Abba, Padre.</strong><br><br><em>[60 segundos de silencio. No llenar. No apresurarlo.]</em><br><br>No para cumplir un ejercicio espiritual. Sino para practicar lo que aprendimos. El Elohim que hizo el universo, el YHWH del Sinaí, el Adonai soberano de todo — quiere que lo llames Abba. Hoy. Ahora.</p>` },
      { t: "pregunta", html: "Pregunta para la semana: ¿Dónde estás actuando como el hijo mayor — haciendo todo bien, pero desde la obligación en lugar de desde la filiación?" },
      { t: "blk", lbl: "Anticipación de la Charla 3", html: `<p class="script">La próxima vez — la última de la serie — vamos a ver las otras dos identidades que vienen de estar en Cristo: miembros de un cuerpo y ramas de la vid.<br><br>Ya exploramos la relación vertical: quién soy con Dios, como hijo. La siguiente es horizontal: quién soy con otros, y cómo produzco fruto desde la unión.<br><br>Oremos.</p>` },
      { t: "nota", html: `Oración de cierre — modelo: "Abba, Padre. Gracias porque corriste hacia nosotros antes de que termináramos nuestro discurso ensayado. Gracias porque todas tus cosas son nuestras. Ayúdanos esta semana a vivir como hijos — a servirte desde ahí, a orar desde ahí, a volver desde ahí cuando fallemos. Amén."<br><br>La oración misma debe sonar como un hijo hablando con su padre — no como un súbdito dirigiéndose a un soberano. Tono cálido, directo, sin palabras grandilocuentes.` }
    ]
  }
];

const nav = document.getElementById('nav');
const prog = document.getElementById('prog');
const panelsEl = document.getElementById('panels');
let cur = 0;

function render(i) {
  cur = i;
  nav.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', j===i));
  prog.querySelectorAll('.ps').forEach((s,j) => {
    s.classList.toggle('done', j < i);
    s.classList.toggle('cur', j === i);
  });
  panelsEl.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', j===i));
}

secs.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nb';
  btn.textContent = s.label;
  btn.onclick = () => render(i);
  nav.appendChild(btn);
  const ps = document.createElement('div'); ps.className = 'ps'; prog.appendChild(ps);
  const panel = document.createElement('div'); panel.className = 'panel';

  let html = `<div class="tbadge">⏱ ${s.tiempo}</div>`;

  s.bloques.forEach(b => {
    if (b.t === 'blk') {
      html += `<div class="blk"><div class="blk-hd">${b.lbl||'Guión'}</div><div class="blk-bd">${b.html}</div></div>`;
    } else if (b.t === 'nota') {
      html += `<div class="nota">${b.html}</div>`;
    } else if (b.t === 'verse') {
      html += `<blockquote class="verse">${b.texto}<cite>${b.ref}</cite></blockquote>`;
    } else if (b.t === 'pregunta') {
      html += `<div class="pregunta">${b.html}</div>`;
    } else if (b.t === 'ilustra') {
      html += `<div class="ilustra">${b.html}</div>`;
    } else if (b.t === 'dato') {
      html += `<div class="dato">${b.html}</div>`;
    } else if (b.t === 'puente') {
      html += `<div class="puente">${b.html}</div>`;
    } else if (b.t === 'trans') {
      html += `<p class="trans">${b.html}</p>`;
    } else if (b.t === 'giro') {
      html += `<div class="giro"><div class="giro-lbl">El giro más radical del NT</div><div class="giro-txt">${b.html.replace(/<[^>]+>/g,'')}</div></div>`;
    } else if (b.t === 'nombres') {
      b.items.forEach(n => {
        html += `<div class="nombre-card">
          <div class="nombre-hd" style="background:${n.bg}20;border-bottom:0.5px solid var(--color-border-tertiary)">
            <div>
              <div class="nombre-hb" style="color:${n.color}">${n.nombre}</div>
              <div class="nombre-sig">${n.significado} · <em style="font-size:11px;color:#888">${n.ref}</em></div>
            </div>
          </div>
          <blockquote class="verse" style="margin:0;border-radius:0;border-left:3px solid ${n.color}">${n.verso}<cite style="color:${n.color}">${n.ref}</cite></blockquote>
          <div class="nombre-bd">${n.desc}</div>
        </div>`;
      });
    } else if (b.t === 'parabola') {
      html += `<div class="parabola-sec"><div class="parabola-lbl">Los tres personajes</div>`;
      b.items.forEach(p => {
        html += `<div class="parabola-row">
          <div class="parabola-icon">${p.icon}</div>
          <div class="parabola-content"><strong>${p.title}</strong><span>${p.body}</span></div>
        </div>`;
      });
      html += `</div>`;
    }
  });

  html += `<div class="navbtns">
    <button class="navb" ${i===0?'disabled':''} onclick="render(${i-1})">← Anterior</button>
    <button class="navb" ${i===secs.length-1?'disabled':''} onclick="render(${i+1})">Siguiente →</button>
  </div>`;

  panel.innerHTML = html;
  panelsEl.appendChild(panel);
});

render(0);
</script>
