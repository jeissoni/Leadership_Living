<div class="nav" id="nav"></div>
<div class="prog" id="prog"></div>
<div id="panels"></div>

<script>
const secs = [
  {
    label: "Apertura",
    tiempo: "0 – 6 min",
    bloques: [
      { t: "nota", html: "Tono de conversación que continúa, no de clase nueva. Hablar como quien retoma el hilo de la semana pasada. No anunciar ‘tres puntos’; dejar que la historia se vaya abriendo." },
      { t: "blk", lbl: "Seguimos desde donde quedamos", html: `<p class="script">La última vez hablamos de estar <em>en Cristo</em>. La vid y las ramas. El matrimonio. El cuerpo. Dónde estás lo cambia todo: no miras a Jesús desde la acera; estás adentro.<br><br>Y si eso ya quedó plantado… hay una pregunta que no se puede evitar. Porque saber <em>dónde</em> estás no alcanza si no sabes <em>quién</em> eres ahí.<br><br>Entonces hoy no cambiamos de tema. Continuamos: si ya estás en Cristo… <strong>¿quién eres desde ahí?</strong></p>` },
      { t: "verse", ref: "1 Juan 3:1", texto: "Mirad cuál amor nos ha dado el Padre, para que seamos llamados hijos de Dios; por esto el mundo no nos conoce, porque no le conoció a él." },
      { t: "blk", lbl: "La respuesta — y lo que duele", html: `<p class="script">Juan no duda. La respuesta es: <strong>hijos de Dios</strong>. No un apodo para sentirnos bien. Identidad.<br><br>Pero miren a su alrededor — y miren adentro — y van a ver la tensión: mucha gente está en Cristo… y aun así vive como si no tuviera Padre. O como si el Padre fuera un jefe al que hay que contentar.<br><br>Sirven. Oran. Cumplen. Y por dentro buscan aprobación, temen el castigo, o controlan todo para no caer.<br><br>Eso no se arregla con más voluntariado. Hay que nombrarlo. Y después hay que mirar cómo Dios responde.</p>` },
      { t: "trans", html: "— Así que empecemos por lo que muchos cargan sin decirlo. —" }
    ]
  },
  {
    label: "Problemática",
    tiempo: "6 – 20 min",
    bloques: [
      { t: "nota", html: "Fluidez: huérfano y esclavo no son ‘punto 1 y 2’; son dos caras de la misma herida. Pasa de uno al otro con ‘y hay otra forma…’. Datos: peso, no cátedra. No terapia en público." },
      { t: "blk", lbl: "Cuando estás en la casa… y te sientes solo", html: `<p class="script">El problema no es que nos falte actividad espiritual. El problema es más íntimo: estando ya en la casa, muchos seguimos viviendo como si nadie nos sostuviera — o como si el amor del Padre hubiera que ganárselo cada semana.<br><br>A veces esa herida se llama <strong>huérfano</strong>. A veces se disfraza de religión y se llama <strong>esclavo</strong>. Es el mismo vacío, con distinta ropa.</p>` },

      { t: "blk", lbl: "La cara del huérfano", html: `<p class="script">Piensen en el Edén. Dios no solo creó; sostenía tres cosas que todo ser humano sigue necesitando: <strong>protección, provisión y propósito</strong>. Cuando la paternidad se rompe —en la casa o en el corazón— esas tres se sienten rotas.<br><br>Y aquí quiero ser cuidadoso: no hace falta haber crecido sin papá biológico para vivir con mentalidad de huérfano. Es un modo de habitar el mundo. Una frase interna que se repite: «si no me aseguro yo, nadie me sostiene».</p>` },
      { t: "dato", html: `<strong>Lo que suele aparecer</strong> cuando esa frase manda: ansiedad por aprobación; identidad que depende de que te aprueben; sensación de que el control siempre está afuera. De ahí salen cosas que muchos reconocen sin querer: crisis de identidad, baja autoestima, miedo crónico al abandono, dificultad para poner límites, apegos disfuncionales, roce constante con figuras de autoridad.` },
      { t: "dato", html: `<strong>Datos que se citan con frecuencia</strong> sobre hogares sin paternidad presente: más riesgo en salud mental; cifras altas en depresión, consumo, cárcel juvenil, pobreza. No los uses como sentencia sobre nadie en la sala. Úsalos como peso: la ausencia deja marca. Si alguien se identifica, no lo explores en público.` },
      { t: "verse", ref: "Salmo 68:5", texto: "Padre de huérfanos y defensor de viudas es Dios en su santa morada." },
      { t: "blk", lbl: "Dios no mira para otro lado", html: `<p class="script">Santiago 1:27 dice que la religión pura visita al huérfano. El corazón de Dios no es indiferente a esa herida.<br><br>Pero nombrar la herida no es todavía la cura. Solo nos deja listos para ver la otra cara — porque a veces el huérfano, cuando entra a la iglesia, no desaparece: <em>se vuelve empleado</em>.</p>` },

      { t: "blk", lbl: "La cara del esclavo", html: `<p class="script">Esta es más “espiritual”, y por eso más peligrosa entre voluntarios.<br><br>Suena así: <strong>debo ganarme el favor de Dios</strong>. Mérito. Si algo sale mal: «Dios me está castigando.» Ansiedad crónica por el futuro. Hipervigilancia financiera y emocional. Necesidad obsesiva de control.<br><br>Y en el equipo: competencia, envidia, celos espirituales, comparación constante. Vacío. Soledad. Hipersensibilidad al rechazo; muros; al primer roce se asume abandono. Y se busca validación en cosas que pasan.<br><br>¿Se dan cuenta? Es el mismo miedo del huérfano… solo que ahora usa lenguaje de ministerio.</p>` },
      { t: "pregunta", html: "Cuando sirves… ¿lo haces como hijo en casa, o como empleado que no quiere que le despidan?" },
      { t: "verse", ref: "Romanos 8:15", texto: "Pues no habéis recibido el espíritu de esclavitud para estar otra vez en temor, sino que habéis recibido el espíritu de adopción, por el cual clamamos: ¡Abba, Padre!" },
      { t: "blk", lbl: "Pablo ya lo había dicho", html: `<p class="script">Pablo no deja espacio a medias. Espíritu de esclavitud → temor. Espíritu de adopción → clamamos Abba.<br><br>Entonces el diagnóstico es simple y duro: muchos estamos en Cristo… y aun así operamos desde el temor. Más esfuerzo no cura eso. Hace falta un Padre.<br><br>Pero ¿quién es ese Padre? Porque no podemos inventarnos uno blando para calmarnos. Tenemos que mirar al Dios que ya se reveló — y ver hasta dónde llega.</p>` },
      { t: "trans", html: "— Empecemos por sus nombres. Lejos… y verdaderos. —" }
    ]
  },
  {
    label: "Solución 1 · Nombres",
    tiempo: "20 – 28 min",
    bloques: [
      { t: "nota", html: "Narrativa: los nombres son escalones de cercanía. Hablarlos como un acercamiento que todavía no llega a casa. Al final, el vacío que queda empuja solo hacia Abba." },
      { t: "blk", lbl: "Antes de Abba, Él ya tenía nombre", html: `<p class="script">Si el problema es temor y distancia, la tentación es fabricar un dios doméstico. Pero Jesús no hace eso. Toma al Dios que Israel ya conocía… y lo acerca.<br><br>Así que, antes del giro, necesitamos sentir el peso de esos nombres. En el mundo bíblico un nombre no es etiqueta: es revelación de carácter. Cinco nombres. Mientras los oyen, pregunten en silencio: ¿qué tipo de relación propone cada uno?</p>` },
      {
        t: "nombres", items: [
          {
            nombre: "Elohim", color: "#534AB7", bg: "#EEEDFE",
            significado: "Dios — el Creador",
            ref: "Génesis 1:1",
            verso: "En el principio creó Dios los cielos y la tierra.",
            desc: `<strong>Elohim</strong>: plenitud de poder creador. Relación: Creador–criatura. Distancia inherente. Reverencia. Necesario… pero todavía no es hogar.`
          },
          {
            nombre: "El Shaddai", color: "#0F6E56", bg: "#E1F5EE",
            significado: "Todopoderoso — el que sustenta",
            ref: "Génesis 17:1",
            verso: "…le apareció el Señor y le dijo: Yo soy el Dios Todopoderoso; anda delante de mí y sé perfecto.",
            desc: `<strong>El Shaddai</strong>: el que sostiene promesas imposibles — Abraham, Job. Relación: Omnipotente–dependiente. Te sostiene… desde arriba.`
          },
          {
            nombre: "Adonai", color: "#185FA5", bg: "#E6F1FB",
            significado: "Señor — autoridad soberana",
            ref: "Salmo 8:1",
            verso: "¡Oh Señor, Señor nuestro, cuán glorioso es tu nombre en toda la tierra!",
            desc: `<strong>Adonai</strong>: el nombre que se leía en voz alta. Relación: Soberano–súbdito. Hay autoridad… y hay distancia.`
          },
          {
            nombre: "Jireh", color: "#854F0B", bg: "#FAEEDA",
            significado: "Proveedor — el que ve y provee",
            ref: "Génesis 22:14",
            verso: "Y llamó Abraham el nombre de aquel lugar, Jehová proveerá…",
            desc: `<strong>Jireh</strong>: en el monte, el carnero. Relación: Proveedor–necesitado. Él ve y provee… pero aún no es la intimidad de sentarte a su mesa.`
          },
          {
            nombre: "YHWH", color: "#993C1D", bg: "#FAECE7",
            significado: "Yo soy el que soy — el del pacto",
            ref: "Éxodo 3:14",
            verso: "Y respondió Dios a Moisés: YO SOY EL QUE SOY…",
            desc: `<strong>YHWH</strong>: pacto y santidad. Cercanía real… y mediada. Nadie entra al Lugar Santísimo sin sangre, una vez al año.`
          }
        ]
      },
      { t: "blk", lbl: "Todo eso es verdad — y todavía falta algo", html: `<p class="script">Creador. Todopoderoso. Señor. Proveedor. Yo Soy. Todo eso es verdad. Ninguna de esas relaciones es todavía <em>Papá</em>.<br><br>¿Ven el hilo? Dios no era lejano porque fuera frío. Era santo. Y la santidad, sin mediación, se siente como distancia.<br><br>La solución no es inventar un dios más blando. Es que <strong>ese mismo Dios</strong> —Elohim, YHWH, Adonai— se acerque… y diga una palabra que nadie se había atrevido a ponerle.</p>` },
      { t: "trans", html: "— Esa palabra llega con Jesús. —" }
    ]
  },
  {
    label: "Solución 2 · Abba",
    tiempo: "28 – 38 min",
    bloques: [
      { t: "nota", html: "Un solo movimiento narrativo: de los nombres → Abba → ‘¿cómo entré?’ → adopción. No cortes bruscos. La adopción responde al huérfano y al esclavo que nombramos al inicio." },
      { t: "giro", html: `Jesús no inventa un dios nuevo. Toma al Elohim, al YHWH, al Adonai — y lo llama <strong>Abba</strong>.` },
      { t: "blk", lbl: "El mismo Dios… con otra puerta", html: `<p class="script">Cuando Jesús enseña a orar, no dice: «Creador nuestro» ni «Todopoderoso nuestro». Dice:</p>` },
      { t: "verse", ref: "Mateo 6:9", texto: "Vosotros, pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre." },
      { t: "blk", lbl: "Demasiado cercano", html: `<p class="script">Padre nuestro. Personal. Plural. No «Padre de Abraham» a distancia: acceso para los que están en él.<br><br>Y en Getsemaní —cuando el cielo parece más cerrado— no vuelve a Elohim. En lo más oscuro, sigue diciendo Abba.</p>` },
      { t: "verse", ref: "Marcos 14:36", texto: "Y decía: Abba, Padre, todas las cosas son posibles para ti; aparta de mí esta copa; mas no lo que yo quiero, sino lo que tú." },
      { t: "dato", html: `<strong>Abba</strong> es arameo de la casa, no del templo. Lo más cercano a «papito». Ningún judío se había atrevido a tanto con el Dios del Sinaí. Jesús lo usa… y nos mete en esa misma palabra. Por eso Pablo la deja en arameo (Romanos 8:15; Gálatas 4:6): para que no se diluya.` },
      { t: "verse", ref: "Juan 1:12", texto: "Mas a todos los que le recibieron, a los que creen en su nombre, les dio potestad de ser hechos hijos de Dios." },
      { t: "blk", lbl: "Entonces… ¿cómo entraste?", html: `<p class="script">Si Jesús nos da potestad de ser hechos hijos, la pregunta natural es: ¿cómo? ¿Por esfuerzo? ¿Por años de servicio? ¿Por un contrato mejor?<br><br>Pablo responde con una imagen que sus lectores entendían de inmediato: la <strong>adopción romana</strong>. Y esos detalles no son curiosidad histórica — responden exactamente a lo que nombramos al principio.</p>` },
      { t: "ilustra", html: `<strong>1. Principalmente adultos.</strong> Dejabas la familia anterior. Deudas: canceladas. Historial judicial: borrado. — <em>El esclavo deja de deber.</em><br><br><strong>2. Mismos derechos que el hijo natural.</strong> No hijo de segunda. Herencia, nombre, acceso. — <em>El huérfano deja de mendigar lugar.</em><br><br><strong>3. Iniciativa siempre del padre.</strong> No era tanto “proteger a un menor” como <em>continuar linaje y dejar herencia</em>. Elección deliberada. — <em>No te colaste; te escogieron.</em>` },
      { t: "verse", ref: "Efesios 1:4–5", texto: "Según nos escogió en él antes de la fundación del mundo… habiéndonos predestinado para ser adoptados hijos suyos por medio de Jesucristo, según el puro afecto de su voluntad." },
      { t: "blk", lbl: "Ya no eres de esa casa", html: `<p class="script">No te recogió por lástima un martes. Te escogió. Canceló la deuda. Borró el historial de esclavitud. Te dio acceso pleno.<br><br>El Elohim que creó los cielos —ese mismo— es Abba. La solución legal y espiritual al huérfano y al esclavo es la misma: <strong>ya no eres de esa casa. Perteneces a otra.</strong><br><br>Pero todavía falta algo. Porque la adopción se entiende con la mente… y el corazón necesita ver el rostro del Padre. Jesús no solo nos dio un título. Nos contó cómo es Él cuando un hijo vuelve — o cuando un hijo nunca se fue, pero tampoco entró a la fiesta.</p>` },
      { t: "trans", html: "— Escuchemos la parábola como quien se mira en ella. —" }
    ]
  },
  {
    label: "Solución 3 · El Padre",
    tiempo: "38 – 48 min",
    bloques: [
      { t: "nota", html: "Contar como historia continua, no como tres viñetas sueltas. Cultura de honor → viaje → corre → regalos. Al final, el puente al hijo mayor ya está sembrado (‘ofende a justos’)." },
      { t: "blk", lbl: "Una casa, una vergüenza, un Padre que corre", html: `<p class="script">Lucas 15. Un hijo pide la herencia en vida. En esa cultura, eso era casi decir: <em>ojalá te mueras</em>. Vergüenza familiar. Reputación rota. El padre tenía derecho a rechazarlo, a exponerlo ante la aldea.<br><br>Si la historia fuera solo justicia, terminaría ahí. Pero Jesús cuenta otra cosa. Y ahí la solución deja de ser concepto… y se vuelve carne.</p>` },
      { t: "parabola", items: [
        { icon: "1", title: "El viaje del menor", body: "País lejano. Malgasta. Cerdos. Quiere comer su comida. Degradación total: dignidad, identidad, pureza. Cuando vuelve, no vuelve como hijo: vuelve con discurso de jornalero. Quiere negociar un contrato. Mentalidad de empleado — la misma que nombramos al inicio." },
        { icon: "2", title: "El padre corre", body: "Un hombre de honor no corre: levantar la túnica era humillante. Él se despoja de posición. Recibe la vergüenza del hijo. Abraza y besa ANTES de la confesión. La gracia llega antes del discurso — y eso desarma al esclavo que venía a negociar." },
        { icon: "3", title: "Restauración", body: "Mejor ropa: dignidad y honor. Anillo: autoridad y plena condición. Sandalias: no esclavo — calzado de hijo. Luego fiesta pública. A veces ofende a “los justos” para salvar a los perdidos. Y ahí aparece el otro hijo…" }
      ]},
      { t: "blk", lbl: "No un puesto — una casa", html: `<p class="script">El hijo vuelve pidiendo trabajo. El Padre responde con hijo. Ropa, anillo, sandalias: no «ya veremos si te portas bien». Restauración plena.<br><br>Eso es lo que Dios hace con el huérfano y con el esclavo: no les da un puesto en la empresa. Les da casa.<br><br>Pero la parábola no termina en el abrazo. Hay alguien que nunca se fue… y aun así está fuera de la fiesta. Y para un grupo que sirve, esa es la escena que más nos mira.</p>` },
      { t: "trans", html: "— Cierro con el hijo mayor… y con nosotros. —" }
    ]
  },
  {
    label: "Pastoral",
    tiempo: "48 – 55 min",
    bloques: [
      { t: "nota", html: "Sin contenido nuevo. Recoger el hilo completo: huérfano → esclavo → Abba → adopción → parábola → ‘¿quién soy yo en esta historia?’. Silencio real. Oración corta." },
      { t: "blk", lbl: "El que se quedó… y también se perdió", html: `<p class="script">El menor se perdió lejos. El mayor puede perderse <em>dentro</em> de la casa: cerca del trabajo, lejos del corazón del Padre.<br><br>Años sirviendo bien. Fuera de la fiesta. «Tantos años te sirvo… y nunca me has dado.» Contrato. Empleado. La mentalidad de esclavo… con buen curriculum ministerial.<br><br>Y el Padre no le dice «trabaja menos». Le dice: «Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas.»</p>` },
      { t: "verse", ref: "Lucas 15:31", texto: "Él entonces le dijo: Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas." },
      { t: "pregunta", html: "Después de todo este camino… ¿dónde te reconoces? ¿Huérfano que busca aprobación, esclavo que teme el castigo, menor que vuelve, o mayor que sirve sin entrar a la fiesta?" },
      { t: "nota", html: "Treinta a cuarenta segundos de silencio. No llenar. Dejar que la pregunta haga el trabajo." },

      { t: "blk", lbl: "Lo que ya tienes — si eres hijo", html: `<p class="script">Si el Espíritu te ha hecho clamar Abba, esto ya es tuyo: acceso íntimo. Herencia eterna. Espíritu Santo. Seguridad. Libertad, no esclavitud. Descanso en gracia. Generosidad y compasión. Esperanza eterna. Guía del Espíritu.<br><br>No es lista de premios. Es el ambiente de la casa.</p>` },
      { t: "verse", ref: "Gálatas 4:6–7", texto: "Y por cuanto sois hijos, Dios envió a vuestros corazones el Espíritu de su Hijo, el cual clama: ¡Abba, Padre! Así que ya no eres esclavo, sino hijo; y si hijo, también heredero de Dios por medio de Cristo." },
      { t: "puente", html: `<strong>Para quien sirve esta semana:</strong> primero soy hijo. Después soy miembro. La filiación es anterior a la función. Si sirves para ganarte la fiesta, estás en el patio del mayor. El Padre no pide más años: te dice que ya estás en casa.` },
      { t: "blk", lbl: "Antes de irnos", html: `<p class="script">No cierro con un resumen. Cierro con dos palabras — las mismas que desarmaron al esclavo y al huérfano esta noche.<br><br>En voz baja o por dentro:<br><br><strong>Abba, Padre.</strong><br><br><em>[60 segundos de silencio.]</em></p>` },
      { t: "pregunta", html: "Esta semana, en lo concreto: ¿oras y sirves como huérfano, como esclavo, o como hijo?" },
      { t: "nota", html: "Oración modelo, cálida y corta: «Abba, gracias porque corriste antes de que termináramos el discurso. Gracias porque no somos huérfanos ni esclavos. Ayúdanos a servir desde la casa. Amén.»" }
    ]
  }
];

const nav = document.getElementById('nav');
const prog = document.getElementById('prog');
const panelsEl = document.getElementById('panels');

function render(i) {
  nav.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', j===i));
  prog.querySelectorAll('.ps').forEach((s,j) => {
    s.classList.toggle('done', j < i);
    s.classList.toggle('cur', j === i);
  });
  panelsEl.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', j===i));
}

secs.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nb';
  btn.textContent = s.label;
  btn.onclick = () => render(i);
  nav.appendChild(btn);
  const ps = document.createElement('div'); ps.className = 'ps'; prog.appendChild(ps);
  const panel = document.createElement('div'); panel.className = 'panel';

  let html = `<div class="tbadge">⏱ ${s.tiempo}</div>`;

  s.bloques.forEach(b => {
    if (b.t === 'blk') {
      if (b.lbl) {
        html += `<div class="blk"><div class="blk-hd">${b.lbl}</div><div class="blk-bd">${b.html}</div></div>`;
      } else {
        html += `<div class="blk"><div class="blk-bd">${b.html}</div></div>`;
      }
    } else if (b.t === 'nota') {
      html += `<div class="nota">${b.html}</div>`;
    } else if (b.t === 'verse') {
      html += `<blockquote class="verse">${b.texto}<cite>${b.ref}</cite></blockquote>`;
    } else if (b.t === 'pregunta') {
      html += `<div class="pregunta">${b.html}</div>`;
    } else if (b.t === 'ilustra') {
      html += `<div class="ilustra">${b.html}</div>`;
    } else if (b.t === 'dato') {
      html += `<div class="dato">${b.html}</div>`;
    } else if (b.t === 'puente') {
      html += `<div class="puente">${b.html}</div>`;
    } else if (b.t === 'trans') {
      html += `<p class="trans">${b.html}</p>`;
    } else if (b.t === 'giro') {
      html += `<div class="giro"><div class="giro-lbl">El giro</div><div class="giro-txt">${b.html}</div></div>`;
    } else if (b.t === 'nombres') {
      b.items.forEach(n => {
        html += `<div class="nombre-card">
          <div class="nombre-hd">
            <div class="nombre-hb" style="color:${n.color}">${n.nombre}</div>
            <div class="nombre-sig">${n.significado} · <em>${n.ref}</em></div>
          </div>
          <blockquote class="verse" style="border-left-color:${n.color}">${n.verso}<cite>${n.ref}</cite></blockquote>
          <div class="nombre-bd">${n.desc}</div>
        </div>`;
      });
    } else if (b.t === 'parabola') {
      html += `<div class="parabola-sec"><div class="parabola-lbl">La parábola</div>`;
      b.items.forEach(p => {
        html += `<div class="parabola-row">
          <div class="parabola-icon">${p.icon}</div>
          <div class="parabola-content"><strong>${p.title}</strong><span>${p.body}</span></div>
        </div>`;
      });
      html += `</div>`;
    }
  });

  html += `<div class="navbtns">
    <button class="navb" ${i===0?'disabled':''} onclick="render(${i-1})">← Anterior</button>
    <button class="navb" ${i===secs.length-1?'disabled':''} onclick="render(${i+1})">Siguiente →</button>
  </div>`;

  panel.innerHTML = html;
  panelsEl.appendChild(panel);
});

render(0);
</script>
