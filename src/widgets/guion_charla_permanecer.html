<div class="nav" id="nav"></div>
<div class="prog" id="prog"></div>
<div id="panels"></div>

<script>
const secs = [
  {
    label: "Apertura",
    tiempo: "0 – 6 min",
    bloques: [
      { t: "nota", html: "Tono de continuidad de serie. Puente con la Biblia. No reabrir canon. Nombrar Semilla y terreno y avanzar al hueco." },
      { t: "blk", lbl: "Seguimos en el mismo campo", html: `<p class="script">Esta serie se llama <em>Semilla y terreno</em>. La última vez vimos la semilla: un libro serio, voz de Dios, no solo herramienta. Hablamos de terreno y fruto: la misma semilla, corazones distintos, el Espíritu que ilumina.<br><br>Hoy no volvemos a demostrar que es Palabra de Dios. Vamos al problema que sigue apareciendo aunque ya sepamos todo eso.</p>` },
      { t: "pregunta", html: "¿Quieres fruto… sin quedarte en la vid?" },
      { t: "blk", lbl: "El hilo de esta noche", html: `<p class="script">Muchos creemos, citamos, cumplimos — y por dentro estamos separados: prisa, pantallas, checklist espiritual, o cansancio de intentar «ser más espirituales».<br><br>La solución no es más actividad. Son tres modos de quedarse: <strong>orar y meditar</strong>, <strong>permanecer</strong>, <strong>adorar</strong>. Y al final, una escena que consuela a quien sirve — y un reto pequeño para la semana.</p>` },
      { t: "trans", html: "— No lo explico todavía: lo cuento. —" }
    ]
  },
  {
    label: "Problemática",
    tiempo: "6 – 14 min",
    bloques: [
      { t: "nota", html: "Abrir contando la semana, no explicando. Confrontar sin señalar a nadie: incluirte siempre («este soy yo»). Los tres puntos que vienen SON la solución; anúncialos al final de esta sección." },
      { t: "ilustra", html: `<strong>La semana que se repite.</strong> Domingo: cantaste de verdad, saliste diciendo «esta semana sí». Lunes: tarde, corriendo. Martes: reunión larga, llegaste con la cabeza en el trabajo, respondiste «ajá» sin escuchar. Miércoles: discusión por algo minúsculo. Jueves: abriste la app, tres líneas, otra pantalla. Viernes: vacío. Sábado: dormiste. Domingo: volviste a cantar y a decir «esta semana sí».` },
      { t: "blk", lbl: "El problema no es el que creen", html: `<p class="script">No es que no creas: tú crees. No es que no quieras: si no quisieras, no estarías aquí.<br><br>Queremos paz sin silencio. Discernimiento sin Escritura. Madurez sin dependencia. Un día que se vea bien —la casa, el trabajo, la relación— y un corazón que no para.<br><br>Y no hablo del cristiano tibio. Hablo del que sabe: explica la doctrina, cita el versículo, ayuda al otro en su crisis… y lleva meses sin una conversación real con Dios.</p>` },
      { t: "verse", ref: "Gálatas 5:22–23, NTV", texto: "En cambio, la clase de fruto que el Espíritu Santo produce en nuestra vida es: amor, alegría, paz, paciencia, gentileza, bondad, fidelidad, humildad y control propio. ¡No existen leyes contra esas cosas!" },
      { t: "blk", lbl: "El fruto, sin la vid", html: `<p class="script">Pablo ya nombró lo que estamos pidiendo. Y miren cómo lo pedimos en la vida de todos los días:<br><br><strong>Amor</strong> en la pareja, pero en la misma casa y en teléfonos distintos. En el trabajo, el de al lado se vuelve un obstáculo.<br><strong>Alegría</strong>, pero solo si el proyecto cierra o la noche en casa sale bien.<br><strong>Paz</strong>, con el teléfono en la comida, el sofá y la cama.<br><strong>Paciencia</strong>, y la queremos ya: con la pareja, con el compañero, con el proceso.<br><strong>Gentileza y bondad</strong> donde nos ven, y el tono seco en casa.<br><strong>Fidelidad</strong> sin la conversación difícil, y sin depender de nadie en el trabajo.<br><strong>Humildad</strong>, pero sin soltar el control de la discusión o del proyecto.<br><strong>Control propio</strong> al llegar cansados, sin quedarnos quietos para que el Espíritu nos gobierne.<br><br>No falta el deseo del fruto. Falta la vid. El fruto no se fabrica: se produce.</p>` },
      { t: "blk", lbl: "Dos caminos, el mismo hueco", html: `<p class="script">El primero es la <strong>prisa</strong>: queremos el fruto y no nos quedamos. Dios queda para cuando haya hueco.<br><br>El segundo es la <strong>lista</strong> —y es el mío—: leí, oré, ayuné, no falté. El Espíritu se vuelve un profesor que califica, la fe una racha, la oración la cuota para que el día salga bien. Se rompe la racha, llega la culpa, y dejamos de acercarnos justo cuando más falta hacía.<br><br>Parecen opuestos. Uno parece flojo; el otro parece espiritual. En los dos hay movimiento; en ninguno hay raíz. En el primero Dios no entra en la semana. En el segundo entra… como tarea. Una tarea no es una relación. <strong>Queremos fruto sin quedarnos en la vid.</strong></p>` },
      { t: "verse", ref: "Marcos 4:18–19, NTV", texto: "Las semillas que cayeron entre los espinos representan a los que oyen la palabra de Dios, pero muy pronto el mensaje queda desplazado por las preocupaciones de esta vida, el atractivo de la riqueza y el deseo por otras cosas, así que no se produce ningún fruto." },
      { t: "blk", lbl: "El terreno más incómodo", html: `<p class="script">La última vez vimos cuatro terrenos. Hay uno que oye y no deja entrar la palabra. Hay otro que la recibe con alegría y, cuando cuesta, se seca. Esos dos nos parecen «los de afuera».<br><br>El tercero se parece a nosotros: esta persona <strong>oye</strong>. No desprecia, no discute: está sentada donde tú estás sentado. Y aun así — «no se produce ningún fruto».<br><br>¿Quién desplaza el mensaje? No un demonio con nombre. Las preocupaciones, la riqueza, «el deseo por otras cosas» — y también la lista religiosa: el deseo de cumplir puede ocupar el terreno tanto como el teléfono. Nunca hubo decisión de alejarse; solo dejó de haber espacio.</p>` },
      { t: "pregunta", html: "¿Cuándo fue la última vez que estuviste a solas con Dios —sin pedir nada, sin correr a nada, sin teléfono en la mano?" },
      { t: "nota", html: "Después de la pregunta: 3–4 segundos de silencio. No pedir manos levantadas. Cerrar con «si te dolió la pregunta, quédate: lo que viene no es un regaño»." },
      { t: "blk", lbl: "Tres soluciones — no tres temas sueltos", html: `<p class="script">Esta noche respondemos con tres movimientos, y cada uno responde una pregunta distinta:<br><br>1. <strong>Orar y meditar</strong> — la conversación. ¿Le hablo y lo escucho?<br>2. <strong>Permanecer</strong> — la unión. ¿De dónde sale lo que doy?<br>3. <strong>Adoración</strong> — la dirección. ¿Quién está en el centro?<br><br>Si suenan a «más tareas», todavía no oyeron. Son maneras de quedarse.</p>` },
      { t: "trans", html: "— Primera solución: conectar el cargador. —" }
    ]
  },
  {
    label: "Orar y meditar",
    tiempo: "14 – 24 min",
    bloques: [
      { t: "blk", lbl: "Dependencia, no técnica", html: `<p class="script">Meditar no es vaciar la mente. Es dejar que una palabra de Dios ocupe el centro hasta que te cambia el paso. Orar no es informar a Dios de tu agenda: es responder a quien ya habló en la Escritura.</p>` },
      { t: "verse", ref: "Salmo 1:2–3, NTV", texto: "sino que se deleitan en la ley del Señor meditando en ella día y noche. Son como árboles plantados a la orilla de un río, que siempre dan fruto en su tiempo…" },
      { t: "ilustra", html: `<strong>El cargador.</strong> Nadie espera que el teléfono se llene de batería por desearlo con fuerza. Hay que enchufarlo. Orar y meditar es eso: dependencia concreta —página abierta, puerta cerrada un rato, atención prestada— no un mood religioso.` },
      { t: "verse", ref: "Mateo 6:6, NTV", texto: "Pero tú, cuando ores, apártate a solas, cierra la puerta detrás de ti y ora a tu Padre en privado. Entonces, tu Padre, quien todo lo ve, te recompensará." },
      { t: "blk", lbl: "Cómo se ve en la práctica", html: `<p class="script">Pasaje completo, lento. Una frase que se queda. Luego orar esa frase: si confronta, confiesa; si consuela, agradece; si manda, pide fuerzas; si revela a Cristo, adóralo.<br><br>Así la oración no flota: responde a la semilla. Así el terreno empieza a recibir lo que ya sabemos que es voz de Dios.</p>` },
      { t: "verse", ref: "Filipenses 4:6–7, NTV", texto: "No se preocupen por nada; en cambio, oren por todo. Díganle a Dios lo que necesitan y denle gracias por todo lo que él ha hecho. Así experimentarán la paz de Dios, que supera todo lo que podemos entender. La paz de Dios cuidará su corazón y su mente mientras vivan en Cristo Jesús." },
      { t: "pregunta", html: "Esta semana… ¿vas a enchufarte a la Palabra, o solo a desear tener batería espiritual?" },
      { t: "trans", html: "— Segunda solución: no el florero — la vid. —" }
    ]
  },
  {
    label: "Permanecer",
    tiempo: "24 – 34 min",
    bloques: [
      { t: "giro", html: `La rama no inventa uvas. Se queda unida. El fruto es consecuencia de <strong>permanecer</strong>, no de forzar.` },
      { t: "verse", ref: "Juan 15:4–5, NTV", texto: "Permanezcan en mí, y yo permaneceré en ustedes. Pues una rama no puede producir fruto si la cortan de la vid, y ustedes tampoco pueden ser fructíferos a menos que permanezcan en mí. Ciertamente, yo soy la vid; ustedes son las ramas. Los que permanecen en mí y yo en ellos producirán mucho fruto porque, separados de mí, no pueden hacer nada." },
      { t: "ilustra", html: `<strong>Árbol y florero.</strong> Un ramo en agua se ve vivo unos días. Después se marchita: no tenía raíz. Muchos conocemos el florero espiritual: servicio hermoso, poco jugo, cansancio a la tercera semana. Permanecer es volver a la raíz — a Cristo — no decorar mejor el florero.` },
      { t: "blk", lbl: "Conexión antes que producción", html: `<p class="script">Permanecer no es un sentimiento bonito. Es quedarte donde ya estás en Cristo: dependencia, no autosuficiencia. La savia baja hacia ti; recibes.<br><br>No es un retiro de tres días: es la conexión que atraviesa el martes que ya tienes.</p>` },
      { t: "ilustra", html: `<strong>Cómo se ve un martes.</strong><br><strong>Al despertar:</strong> llevarte una frase antes de que el teléfono te diga de qué se trata el día.<br><strong>Antes del correo:</strong> diez segundos —«separados de ti nada puedo hacer»— y después abres el correo.<br><strong>Reunión tensa:</strong> una pausa de un segundo antes de responder. Igual dirás lo difícil; cambia de dónde sale.<br><strong>Almuerzo:</strong> una vez en la semana, dejar el hueco abierto: sin pantalla, o tres cuadras contándole lo que pasó.<br><strong>La puerta de casa:</strong> treinta segundos en el carro —«aquí estoy»— antes de entrar.<br><strong>Cuando fallas:</strong> volver el mismo día, no esperar al domingo ni prometer racha el lunes.<br><strong>Al cerrar:</strong> gracias, perdón, mañana también.<br><br>No es una hora más en la agenda: es la misma agenda, con atención.` },
      { t: "dato", html: `<strong>Puente con Identidad en Cristo.</strong> Ya están en la vid. Permanecer no los mete: los ayuda a no vivir como si estuvieran cortados. Una frase basta; no reabrir toda esa serie.` },
      { t: "pregunta", html: "En el correo, en la reunión, en la puerta de casa… ¿estabas en la vid, o en el florero?" },
      { t: "trans", html: "— Tercera solución: ¿a quién le das la atención? —" }
    ]
  },
  {
    label: "Adoración",
    tiempo: "34 – 42 min",
    bloques: [
      { t: "giro", html: `<strong>¿No es lo mismo que permanecer?</strong> No. Permanecer responde <em>de dónde sale lo que doy</em>; adorar responde <em>quién está en el centro</em>. La rama permanece pegada al tronco: si la cortan, muere. La planta adora girando hacia la luz: si la orientan a la oscuridad, crece torcida. Conexión y orientación.` },
      { t: "blk", lbl: "Fallan distinto", html: `<p class="script">Cuando falla el permanecer aparece la autosuficiencia —«yo puedo solo»— y el síntoma es cansancio. Cuando falla la adoración aparece otra cosa en el centro —«esto vale más»— y el síntoma es comparación, ansiedad por el resultado, quedarse el crédito.<br><br>Prueba de la semana: si algo salió bien y te quedaste el crédito, falló la adoración. Si algo salió mal y te derrumbaste porque todo dependía de ti, faltó permanecer.<br><br>Se puede estar unido y distraído. Y se puede cantar fortísimo estando cortado: el ramo del florero también luce en el centro de la mesa.</p>` },
      { t: "blk", lbl: "Adorar es mirar", html: `<p class="script">Adoración no es solo el bloque de canciones. Es poner a Dios en el centro de la atención —con la voz, con el cuerpo, con la semana.<br><br>Sin adoración, orar y meditar se vuelven técnica. Con adoración, vuelven a ser relación.</p>` },
      { t: "verse", ref: "Salmo 95:1–2, NTV", texto: "¡Vengan, cantemos al Señor! Aclamemos con alegría a la Roca de nuestra salvación. Acerquémonos a él con acción de gracias. Cantémosle salmos de alabanza." },
      { t: "verse", ref: "Romanos 12:1, NTV", texto: "Por lo tanto, amados hermanos, les ruego que entreguen su cuerpo a Dios por todo lo que él ha hecho a favor de ustedes. Que sea un sacrificio vivo y santo, la clase de sacrificio que a él le agrada. Esa es la verdadera forma de adorarlo." },
      { t: "ilustra", html: `<strong>El músico en el metro.</strong> Un violinista de primer nivel tocó en una estación; casi nadie se detuvo. La belleza estaba ahí. Faltó atención. Así pasa en una semana llena: Dios no está ausente; nosotros vamos de prisa. Adorar es detenerse y mirar.` },
      { t: "blk", lbl: "Cómo nace en lo concreto", html: `<p class="script">A veces es una canción a solas. A veces un Salmo leído en voz alta. A veces tres gracias concretas dichas al Padre sin pedir nada todavía.<br><br>Y a menudo nace del pasaje: si ves a Cristo, adóralo. Esa es la tercera solución al fruto sin raíz: un corazón que deja de mirarse y mira a Dios.</p>` },
      { t: "ilustra", html: `<strong>Adorar entre lunes y sábado.</strong> La atención cambiando de dueño:<br><strong>Camino al trabajo:</strong> que la música no sea relleno — canta como si le hablaras a alguien.<br><strong>Cuando algo sale bien:</strong> «me lo merecía» o «esto viene de ti». Nadie te oye elegir.<br><strong>Cuando llega el pago:</strong> dar una parte antes de repartir el resto.<br><strong>En la mesa:</strong> nombrar una cosa concreta del día, no la fórmula automática.<br><strong>Cuando a otro le va mejor:</strong> volver la comparación en gracias.<br><strong>Cuando te trataron mal:</strong> «esto te lo entrego, no me lo cobro yo».<br><strong>Al final del día:</strong> dormir es admitir que el mundo no se sostiene por ti.` },
      { t: "trans", html: "— Ahora una casa, dos hermanas, y una sola cosa por la que vale la pena preocuparse. —" }
    ]
  },
  {
    label: "Pastoral",
    tiempo: "42 – 50 min",
    bloques: [
      { t: "nota", html: "Leer Lucas 10:38–42 completo. No avergonzar a Marta. Consolar a quien sirve agitado. Ánimo, no culpa." },
      { t: "blk", lbl: "María y Marta", html: `<p class="script">Jesús entra a una casa. Marta sirve —de verdad sirve—. María se sienta a escuchar. Marta se agita y se queja. Jesús no desprecia el servicio. La llama «mi apreciada Marta», nombra la agitación… y la <em>sola cosa por la que vale la pena preocuparse</em>.</p>` },
      { t: "verse", ref: "Lucas 10:41–42, NTV", texto: "Mi apreciada Marta, ¡estás preocupada y tan inquieta con todos los detalles! Hay una sola cosa por la que vale la pena preocuparse. María la ha descubierto, y nadie se la quitará." },
      { t: "blk", lbl: "Para quien sirve esta semana", html: `<p class="script">Escuchen el consuelo: esta noche no te mando a hacer más turnos. Te invito a sentarte.<br><br>La intimidad sostiene el servicio; no al revés. Puedes ser Marta en el equipo y aun así elegir esa sola cosa antes de abrir la puerta. Permanecer no cancela el ministerio: lo alimenta.<br><br>Si llegaste cansado, con culpa de «no oro suficiente», oye esto: el Padre no es un coach de rachas. Es Padre. Te espera en la vid.</p>` },
      { t: "pregunta", html: "¿En qué te reconoces hoy: Marta agitada, María sentada… o las dos en la misma semana?" },
      { t: "nota", html: "Veinte a treinta segundos de silencio. No llenar." },
      { t: "trans", html: "— Un reto que quepa en la vida real. —" }
    ]
  },
  {
    label: "Reto",
    tiempo: "50 – 55 min",
    bloques: [
      { t: "nota", html: "Bajar volumen. Entregar el reto claro. Puede proyectarse o dictarse lento." },
      { t: "blk", lbl: "Tres espacios, una semana", html: `<p class="script">No se llevan un programa. Se llevan presencia. Cuatro gestos, mismos tres movimientos de esta noche:</p>` },
      { t: "dato", html: `<strong>Reto — Tres espacios, una semana</strong><br>1. <strong>Diario (10–15 min):</strong> pasaje corto → meditar una frase → orar esa frase.<br>2. <strong>Tres veces:</strong> 5 minutos de silencio antes de pedir (permanecer).<br>3. <strong>Un momento de adoración:</strong> canción, Salmo en voz alta, o 3 agradecimientos concretos a Dios.<br>4. <strong>Cierre:</strong> una línea a un hermano o al grupo: «esta semana permanecí en…».<br><br>No es puntuación. Si fallas un día, vuelves al siguiente. El Padre no lleva racha; lleva hijos.` },
      { t: "puente", html: `<strong>Para el voluntario:</strong> esta semana profundizamos semilla en el terreno: oír, quedarte, mirar. Primero la vid; después el turno.` },
      { t: "pastoral", lbl: "Cierre", html: `<p class="script">Queríamos fruto sin raíz. Dios ofrece vid.<br><br>Ora y medita — enchúfate. Permanece — no vivas en el florero. Adora — mira a quien ya te miró en la cruz.<br><br>Y si Marta grita por dentro esta semana, recuerda: hay una sola cosa por la que vale la pena preocuparse. Siéntate. Luego sirve.</p>` },
      { t: "pregunta", html: "Esta semana: ¿fruto sin vid… o tres espacios para quedarte?" },
      { t: "nota", html: "Oración modelo: «Padre, gracias porque la semilla es buena y porque nos invitas a la vid. Enséñanos a meditar, a permanecer y a adorarte. Consolamos a Marta en nosotros y anímanos como a María. Por Jesús. Amén.»" }
    ]
  }
];

const nav = document.getElementById('nav');
const prog = document.getElementById('prog');
const panelsEl = document.getElementById('panels');

function render(i) {
  nav.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', j===i));
  prog.querySelectorAll('.ps').forEach((s,j) => {
    s.classList.toggle('done', j < i);
    s.classList.toggle('cur', j === i);
  });
  panelsEl.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', j===i));
}

secs.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'nb';
  btn.textContent = s.label;
  btn.onclick = () => render(i);
  nav.appendChild(btn);
  const ps = document.createElement('div'); ps.className = 'ps'; prog.appendChild(ps);
  const panel = document.createElement('div'); panel.className = 'panel';

  let html = `<div class="tbadge">⏱ ${s.tiempo}</div>`;

  s.bloques.forEach(b => {
    if (b.t === 'blk') {
      html += b.lbl
        ? `<div class="blk"><div class="blk-hd">${b.lbl}</div><div class="blk-bd">${b.html}</div></div>`
        : `<div class="blk"><div class="blk-bd">${b.html}</div></div>`;
    } else if (b.t === 'nota') {
      html += `<div class="nota">${b.html}</div>`;
    } else if (b.t === 'verse') {
      html += `<blockquote class="verse">${b.texto}<cite>${b.ref}</cite></blockquote>`;
    } else if (b.t === 'pregunta') {
      html += `<div class="pregunta">${b.html}</div>`;
    } else if (b.t === 'ilustra') {
      html += `<div class="ilustra">${b.html}</div>`;
    } else if (b.t === 'dato') {
      html += `<div class="dato">${b.html}</div>`;
    } else if (b.t === 'puente') {
      html += `<div class="puente">${b.html}</div>`;
    } else if (b.t === 'trans') {
      html += `<p class="trans">${b.html}</p>`;
    } else if (b.t === 'giro') {
      html += `<div class="giro"><div class="giro-lbl">El giro</div><div class="giro-txt">${b.html}</div></div>`;
    } else if (b.t === 'pastoral') {
      html += `<div class="pastoral"><div class="pastoral-lbl">${b.lbl}</div>${b.html}</div>`;
    }
  });

  html += `<div class="navbtns">
    <button class="navb" ${i===0?'disabled':''} onclick="render(${i-1})">← Anterior</button>
    <button class="navb" ${i===secs.length-1?'disabled':''} onclick="render(${i+1})">Siguiente →</button>
  </div>`;

  panel.innerHTML = html;
  panelsEl.appendChild(panel);
});

render(0);
</script>
